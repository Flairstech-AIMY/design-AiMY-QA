<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Composer Badge Variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Six ways to attach "Only my results" to the right edge of the Ask AiMY
   composer (AIMY-2423). Each replica uses the product's own composer
   geometry: 760px max, 54px tall, 40px radius, #1e2428 fill in dark. */
:root {
  --qa: #8b4ff4; --qa-rgb: 139, 79, 244; --mine-text: #c9b0ff;
  --page: #16121d; --card: #1a1524; --card-2: #231b30; --ink: #f5f7fb; --ink-2: #c3ceda; --ink-3: #93a2b4;
  --bar: #1e2428; --bar-border: rgba(255,255,255,.1); --bar-ink: #a8b5c5; --field: #2b1f48;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --mine-text: #5b2bbf;
  --page: #f6f2fd; --card: #ffffff; --card-2: #faf7fe; --ink: #10151b; --ink-2: #2a3540; --ink-3: #566472;
  --bar: #ffffff; --bar-border: rgba(16,24,40,.14); --bar-ink: #566472; --field: #efe7fd;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--page); color: var(--ink); font-family: "Poppins", system-ui, sans-serif; line-height: 1.5; }
::selection { background: rgba(var(--qa-rgb), .35); }
button { font: inherit; }
button:focus-visible { outline: 2px solid var(--mine-text); outline-offset: 2px; }

.wrap { max-width: 1120px; margin: 0 auto; padding: 56px 24px 96px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 40px; }
h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.lede { max-width: 62ch; margin-top: 10px; color: var(--ink-2); font-size: 15px; }
.controls { display: flex; gap: 8px; }
.ctl { min-height: 36px; padding: 0 14px; border: 0; border-radius: 9999px; background: var(--card-2); color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; }
.ctl:hover { background: rgba(var(--qa-rgb), .22); }
.ctl[aria-pressed="true"] { background: var(--qa); color: #fff; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.v { min-width: 0; background: var(--card); border-radius: 20px; padding: 24px 24px 22px; }
.v-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.v-id { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: rgba(var(--qa-rgb), .2); color: var(--mine-text); font-weight: 800; font-size: 14px; }
h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.v-now { margin-left: auto; padding: 3px 10px; border-radius: 9999px; background: rgba(var(--qa-rgb), .2); color: var(--mine-text); font-size: 12px; font-weight: 600; }
.v-sum { margin-top: 8px; max-width: 78ch; color: var(--ink-2); font-size: 14px; }
.v-toggle { margin-left: 8px; min-height: 30px; padding: 0 12px; border: 0; border-radius: 9999px; background: var(--card-2); color: var(--ink-2); font-size: 12px; font-weight: 600; cursor: pointer; }
.v-toggle:hover { color: var(--ink); }

/* The stage: a slice of the violet-mode page with the composer centred, as
   the product's #aimyFloatWrap does. Isolated so a badge tucked behind the
   bar (z-index -1) stays above the card. */
.stage { position: relative; isolation: isolate; display: flex; justify-content: center; align-items: center; gap: 0; min-height: 150px; margin: 18px 0 16px; padding: 30px 16px; border-radius: 14px; background: radial-gradient(70% 120% at 50% 0%, rgba(var(--qa-rgb), .18), transparent 70%), var(--page); overflow: hidden; }
.bar { position: relative; flex: 0 1 640px; min-width: 0; display: flex; align-items: center; gap: 10px; height: 54px; padding: 8px; border-radius: 40px; background: var(--bar); border: 1px solid var(--bar-border); box-shadow: 0 8px 32px rgba(0,0,0,.45); transition: border-color 220ms var(--ease); }
:root[data-theme="light"] .bar { box-shadow: 0 8px 32px rgba(16,24,40,.1); }
.stage.on .bar { border-color: rgba(var(--qa-rgb), .6); }
.ico { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: #11203a; color: #8fb4ff; }
.ico svg { width: 18px; height: 18px; }
.ph { flex: 1; min-width: 0; color: var(--bar-ink); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hint { flex: none; color: var(--bar-ink); font-size: 12px; }
.send { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--qa); color: #fff; }
.send svg { width: 18px; height: 18px; }

/* Shared badge parts */
.av { display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; color: #5b2bbd; font-size: 8.5px; font-weight: 700; letter-spacing: .02em; }
.x { position: relative; display: inline-grid; place-items: center; flex: none; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%; cursor: pointer; }
.x::before { content: ""; position: absolute; inset: -6px; }
.x svg { width: 12px; height: 12px; }
.badge { opacity: 0; visibility: hidden; transition: opacity 140ms var(--ease), transform 140ms var(--ease), visibility 0s linear 140ms; }
.stage.on .badge { opacity: 1; visibility: visible; transition-duration: 260ms, 260ms, 0s; transition-delay: 0s; }

/* 1. Scope token: field + nested chip, tucked behind the bar's end. */
.v1 .stage.on .bar { margin-right: 186px; }
.v1 .badge { position: absolute; top: 50%; left: calc(100% - 26px); z-index: -1; display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 6px 0 36px; border-radius: 0 9999px 9999px 0; background: var(--field); color: var(--mine-text); font-size: 11.5px; white-space: nowrap; box-shadow: 0 8px 18px -8px rgba(12,4,32,.6); transform: translate(-48px, -50%); }
.v1 .stage.on .badge { transform: translate(0, -50%); }
.v1 .lbl { font-weight: 500; }
.v1 .chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 2px; border-radius: 9999px; background: var(--qa); color: #fff; font-weight: 600; }
.v1 .x { background: rgba(var(--qa-rgb), .24); color: var(--mine-text); }
.v1 .x:hover { background: rgba(var(--qa-rgb), .42); color: #fff; }

/* 2. Solid plug: one flat violet capsule, tucked behind the bar's end. */
.v2 .stage.on .bar { margin-right: 156px; }
.v2 .badge { position: absolute; top: 50%; left: calc(100% - 26px); z-index: -1; display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 7px 0 32px; border-radius: 0 9999px 9999px 0; background: var(--qa); color: #fff; font-size: 11.5px; font-weight: 600; white-space: nowrap; box-shadow: 0 8px 18px -8px rgba(12,4,32,.6); transform: translate(-48px, -50%); }
.v2 .stage.on .badge { transform: translate(0, -50%); }
.v2 .x { background: rgba(255,255,255,.16); color: #fff; }
.v2 .x:hover { background: rgba(255,255,255,.3); }

/* 3. Avatar puck: your avatar sits ON the bar's right end, ringed in the
   bar's colour, with a label tail behind it. */
.v3 .stage.on .bar { margin-right: 134px; }
.v3 .badge { position: absolute; top: 50%; left: calc(100% - 4px); display: flex; align-items: center; transform: translate(-12px, -50%) scale(.9); transform-origin: 20px 50%; }
.v3 .stage.on .badge { transform: translate(0, -50%); }
.v3 .puck { position: relative; z-index: 1; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--qa); box-shadow: 0 0 0 4px var(--bar), 0 6px 14px -4px rgba(12,4,32,.55); color: #fff; font-size: 12px; font-weight: 700; }
.v3 .tail { display: flex; align-items: center; gap: 6px; height: 28px; margin-left: -14px; padding: 0 5px 0 22px; border-radius: 0 9999px 9999px 0; background: var(--field); color: var(--mine-text); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.v3 .x { background: transparent; color: var(--mine-text); }
.v3 .x:hover { background: rgba(var(--qa-rgb), .3); }

/* 4. Corner flag: a pill pinned to the bar's top-right corner, straddling
   both edges, like a notification badge that carries words. */
.v4 .stage { padding-top: 40px; }
.v4 .badge { position: absolute; top: -12px; right: -10px; z-index: 2; display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 3px 0 3px; border-radius: 9999px; background: var(--qa); color: #fff; font-size: 11px; font-weight: 600; white-space: nowrap; box-shadow: 0 0 0 3px var(--bar), 0 6px 14px -6px rgba(12,4,32,.6); transform: translate(-6px, 6px) scale(.85); transform-origin: 100% 0; }
.v4 .stage.on .badge { transform: none; }
.v4 .av { width: 18px; height: 18px; font-size: 7px; }
.v4 .x { width: 18px; height: 18px; background: rgba(255,255,255,.16); color: #fff; }
.v4 .x svg { width: 10px; height: 10px; }

/* 5. End cap: the bar's own right end turns violet and holds the scope and
   the send button, so the attachment is a segment of the bar itself. */
.v5 .cap { flex: none; display: flex; align-items: center; gap: 6px; height: 38px; margin-right: -1px; padding: 0 1px 0 4px; border-radius: 9999px; transition: background 220ms var(--ease), padding 220ms var(--ease); }
.v5 .stage.on .cap { padding-left: 4px; background: rgba(var(--qa-rgb), .22); }
.v5 .badge { display: flex; align-items: center; gap: 6px; max-width: 0; overflow: hidden; color: var(--mine-text); font-size: 11.5px; font-weight: 600; white-space: nowrap; transition: max-width 220ms var(--ease), opacity 160ms var(--ease), visibility 0s linear 220ms; }
.v5 .stage.on .badge { max-width: 200px; transition-delay: 0s; }
.v5 .x { background: transparent; color: var(--mine-text); }
.v5 .x:hover { background: rgba(var(--qa-rgb), .3); }
.v5 .sep { width: 1px; height: 18px; background: rgba(var(--qa-rgb), .4); }
.v5 .stage.on .hint { display: none; }

/* 6. Quiet tail: no capsule. A violet thread runs out of the bar's right end
   into a line of text and a text action; the lightest of the six. */
.v6 .stage.on .bar { margin-right: 275px; }
.v6 .badge { position: absolute; top: 50%; left: 100%; display: flex; align-items: center; gap: 8px; padding-left: 0; color: var(--mine-text); font-size: 12px; font-weight: 600; white-space: nowrap; transform: translate(-8px, -50%); }
.v6 .stage.on .badge { transform: translate(0, -50%); }
.v6 .thread { width: 14px; height: 3px; border-radius: 0 3px 3px 0; background: var(--qa); }
.v6 .av { width: 20px; height: 20px; background: var(--qa); color: #fff; font-size: 7.5px; }
.v6 .act { padding: 3px 6px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-2); font-size: 12px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.v6 .act:hover { background: rgba(var(--qa-rgb), .2); color: var(--ink); }

.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 28px; font-size: 13.5px; color: var(--ink-2); }
.notes b { display: block; color: var(--ink); font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.notes ul { padding-left: 18px; }
.refs { margin-top: 12px; font-size: 12.5px; color: var(--ink-3); }
.refs a { color: var(--mine-text); text-underline-offset: 3px; }

@media (max-width: 760px) {
  .wrap { padding: 36px 16px 64px; }
  .v { padding: 18px 16px; }
  .hint { display: none; }
  .ph { font-size: 13px; }
  .v1 .lbl, .v1 .chip .t, .v2 .t, .v3 .t, .v4 .t, .v5 .t, .v6 .t { display: none; }
  .v1 .stage.on .bar, .v2 .stage.on .bar { margin-right: 54px; }
  .v1 .chip { padding: 0 2px; }
  .v3 .stage.on .bar { margin-right: 70px; }
  .v3 .tail { padding-left: 16px; }
  .v6 .stage.on .bar { margin-right: 168px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0ms !important; }
  .v1 .badge, .v2 .badge { transform: translate(0, -50%); }
  .v3 .badge, .v6 .badge { transform: translate(0, -50%); }
  .v4 .badge { transform: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Only my results, attached to the composer</h1>
      <p class="lede">Six badges for the right edge of the Ask AiMY bar, shown in violet mode. Each is live: switch it off and on to see how it attaches. Pick one and I'll build it into all six pages.</p>
    </div>
    <div class="controls">
      <button class="ctl" type="button" id="themeBtn" aria-pressed="false">Light theme</button>
      <button class="ctl" type="button" id="replayAll">Replay all</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<template id="barTpl">
  <div class="bar">
    <span class="ico" aria-hidden="true"><svg class="lucide lucide-sparkles" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></svg></span>
    <span class="ph">Ask AiMY anything, or describe what you'd like to filter…</span>
    <span class="hint">Enter to send</span>
    <span class="send" aria-hidden="true"><svg class="lucide lucide-send-horizontal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.714 3.048a.498.498 0 0 0-.683.627l2.843 7.627a2 2 0 0 1 0 1.396l-2.842 7.627a.498.498 0 0 0 .682.627l18-8.5a.5.5 0 0 0 0-.904z"/><path d="M6 12h16"/></svg></span>
  </div>
</template>

<script>
(function () {
  "use strict";
  var X = '<svg class="lucide lucide-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
  var AV = '<span class="av" aria-hidden="true">EY</span>';
  function xBtn() { return '<button class="x" type="button" data-off aria-label="Show everyone’s results">' + X + "</button>"; }
  function mob(id, title) { return '<a href="https://mobbin.com/screens/' + id + '" target="_blank" rel="noopener">' + title + "</a>"; }

  var V = [
    { n: 1, title: "Scope token", now: true,
      sum: "A quiet violet field plugged into the bar's end, labelled Scope, holding the scope as a solid chip with the × outside it. Reads as a sentence: Scope, Only mine, clear.",
      badge: '<div class="badge" role="status"><span class="lbl">Scope</span><span class="chip">' + AV + '<span class="t">Only mine</span></span>' + xBtn() + "</div>",
      pro: ["Clearest hierarchy: field, value, clear", "Says what the mode is (a scope), not only that it's on"],
      con: ["Widest of the six (186px)", "Two shades of violet to keep in balance in light theme"],
      refs: mob("0858df95-ec2b-4f7e-acd8-77bf1a0bf43a", "Devin, Creator is [person]") + ", " + mob("cb09bda3-0a66-4553-b659-3218c3099122", "Whop, Preview as [Admin]") + ", " + mob("0271ec95-9287-4a75-bfcd-4b4e5b6e59a5", "Tana, person chip") },
    { n: 2, title: "Solid plug",
      sum: "One flat violet capsule tucked behind the bar's rounded end, with your avatar, Only my results and an ×. The bar's end and shadow fall across it, so it reads as plugged in.",
      badge: '<div class="badge" role="status">' + AV + '<span class="t">Only my results</span>' + xBtn() + "</div>",
      pro: ["Loudest and simplest: one shape, one colour", "Matches the filter chip's words exactly"],
      con: ["A big violet block next to the violet send button", "Repeats the chip rather than adding meaning"],
      refs: mob("1de6d932-63c7-4838-b317-800e02aab879", "Notion, person chip") + ", " + mob("fab1bdf8-065c-4152-a885-cd9c46899cb3", "Copilot, removable mode token") },
    { n: 3, title: "Avatar puck",
      sum: "Your avatar sits on the bar's right end, ringed in the bar's colour so it notches the outline, with a short label tail running out behind it. You, attached to the question.",
      badge: '<div class="badge" role="status"><span class="puck" aria-hidden="true">EY</span><span class="tail"><span class="t">Only mine</span>' + xBtn() + "</span></div>",
      pro: ["The person is the hero, which is the point of the mode", "Compact: 134px, and only 70px on phones"],
      con: ["A ring notch is a new shape for the product", "The avatar alone can read as a profile link"],
      refs: mob("4faf4fee-bfbd-4ff5-b811-a0f8655c8138", "Delphi, avatar puck with name") + ", " + mob("0e209d9a-bd32-4bfc-9818-acd69949f45e", "Ferndesk, pill on the composer frame") },
    { n: 4, title: "Corner flag",
      sum: "A small violet pill pinned to the bar's top-right corner, straddling both edges like a notification badge that carries words. The bar keeps its full width.",
      badge: '<div class="badge" role="status">' + AV + '<span class="t">Only mine</span>' + xBtn() + "</div>",
      pro: ["Costs no width: the bar stays centred and full size", "Familiar placement: corner badges mean 'state'"],
      con: ["Sits over the filter tray's corner on Reviews and My Profile", "Small (24px tall) next to a 54px bar"],
      refs: mob("0e209d9a-bd32-4bfc-9818-acd69949f45e", "Ferndesk, status on the frame") + ", " + mob("06d2987b-27cc-4793-96aa-0a30714db307", "Remote, filter token") },
    { n: 5, title: "End cap",
      sum: "No separate badge: the bar's own right end turns violet and gathers your avatar, Only mine, × and the send button into one segment. The scope travels with every question you send.",
      inside: true,
      badge: '<span class="badge" role="status">' + AV + '<span class="t">Only mine</span>' + xBtn() + '<span class="sep" aria-hidden="true"></span></span>',
      pro: ["Most integrated: the scope is part of sending", "Zero extra width outside the bar"],
      con: ["Takes room from the question on narrow screens", "Hides 'Enter to send' while on"],
      refs: mob("62284ada-24ea-4033-8b3a-92ecc11f028e", "ClickUp, source scope in the composer") + ", " + mob("e2f12dd6-645c-4903-86f8-f92d428acfc4", "Perplexity, mode in the composer") },
    { n: 6, title: "Quiet tail",
      sum: "The lightest: a short violet thread runs out of the bar's end into your avatar, one line of text and a plain Show everyone's link. No capsule, no fill.",
      badge: '<div class="badge" role="status"><span class="thread" aria-hidden="true"></span>' + AV + '<span class="t">Only your results</span><button class="act" type="button" data-off>Show everyone’s</button></div>',
      pro: ["Calmest; lets the violet theme do the work", "The way back is a named action, not an icon"],
      con: ["Text on the page canvas, so contrast depends on what's behind", "Widest outside the bar (275px); on a phone the question field shrinks to about 110px"],
      refs: mob("21ea4703-081d-4dbe-9114-95445e9b0966", "Gumloop, strip docked to the composer") + ", " + mob("14325480-89b3-4952-bb9e-261b1da9b528", "X, text action beside the composer") }
  ];

  var grid = document.getElementById("grid");
  var tpl = document.getElementById("barTpl");

  V.forEach(function (v) {
    var art = document.createElement("article");
    art.className = "v v" + v.n;
    art.innerHTML =
      '<div class="v-head"><span class="v-id">' + v.n + "</span><h2>" + v.title + "</h2>" +
      '<button class="v-toggle" type="button" data-toggle aria-pressed="true">Switch off</button>' +
      (v.now ? '<span class="v-now">Built now</span>' : "") + "</div>" +
      '<p class="v-sum">' + v.sum + "</p>" +
      '<div class="stage on"></div>' +
      '<div class="notes"><div><b>Strong</b><ul>' + v.pro.map(function (p) { return "<li>" + p + "</li>"; }).join("") + "</ul></div>" +
      '<div><b>Weak</b><ul>' + v.con.map(function (p) { return "<li>" + p + "</li>"; }).join("") + "</ul></div></div>" +
      '<p class="refs">References on Mobbin: ' + v.refs + "</p>";
    var stage = art.querySelector(".stage");
    stage.appendChild(tpl.content.cloneNode(true));
    var bar = stage.querySelector(".bar");
    if (v.inside) {
      var send = bar.querySelector(".send");
      var cap = document.createElement("span");
      cap.className = "cap";
      cap.innerHTML = v.badge;
      bar.insertBefore(cap, send);
      cap.appendChild(send);
    } else {
      bar.insertAdjacentHTML("beforeend", v.badge);
    }
    grid.appendChild(art);
  });

  function setOn(art, on) {
    art.querySelector(".stage").classList.toggle("on", on);
    var t = art.querySelector("[data-toggle]");
    t.setAttribute("aria-pressed", String(on));
    t.textContent = on ? "Switch off" : "Switch on";
  }
  grid.addEventListener("click", function (e) {
    var art = e.target.closest(".v");
    if (!art) return;
    if (e.target.closest("[data-off]")) setOn(art, false);
    else if (e.target.closest("[data-toggle]")) setOn(art, !art.querySelector(".stage").classList.contains("on"));
  });
  document.getElementById("replayAll").addEventListener("click", function () {
    var arts = grid.querySelectorAll(".v");
    arts.forEach(function (a) { setOn(a, false); });
    setTimeout(function () { arts.forEach(function (a) { setOn(a, true); }); }, 420);
  });
  var themeBtn = document.getElementById("themeBtn");
  themeBtn.addEventListener("click", function () {
    var light = document.documentElement.getAttribute("data-theme") !== "light";
    if (light) document.documentElement.setAttribute("data-theme", "light");
    else document.documentElement.removeAttribute("data-theme");
    themeBtn.setAttribute("aria-pressed", String(light));
  });
})();
</script>
</body>
</html>
