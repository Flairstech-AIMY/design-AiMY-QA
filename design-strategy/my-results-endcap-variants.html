<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>End Cap Variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Round 2 of the composer badge (AIMY-2423): six ways to build option 5,
   the End cap. In every one the bar's own right end becomes the place where
   "Only my results" lives, together with the send button, so the scope
   travels with every question. Same composer geometry as the product:
   760px max, 54px tall, 40px radius, #1e2428 in dark. */
:root {
  --qa: #8b4ff4; --qa-rgb: 139, 79, 244; --qa-deep: #6a33d4; --mine-text: #c9b0ff;
  --page: #16121d; --card: #1a1524; --card-2: #231b30; --ink: #f5f7fb; --ink-2: #c3ceda; --ink-3: #93a2b4;
  --bar: #1e2428; --bar-border: rgba(255,255,255,.1); --bar-ink: #a8b5c5; --well: #140f1f;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --mine-text: #5b2bbf;
  --page: #f6f2fd; --card: #ffffff; --card-2: #faf7fe; --ink: #10151b; --ink-2: #2a3540; --ink-3: #566472;
  --bar: #ffffff; --bar-border: rgba(16,24,40,.14); --bar-ink: #566472; --well: #e9e0fb;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--page); color: var(--ink); font-family: "Poppins", system-ui, sans-serif; line-height: 1.5; }
::selection { background: rgba(var(--qa-rgb), .35); }
button { font: inherit; }
button:focus-visible { outline: 2px solid var(--mine-text); outline-offset: 2px; }

.wrap { max-width: 1120px; margin: 0 auto; padding: 56px 24px 96px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 40px; }
h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.lede { max-width: 64ch; margin-top: 10px; color: var(--ink-2); font-size: 15px; }
.lede a { color: var(--mine-text); text-underline-offset: 3px; }
.controls { display: flex; gap: 8px; }
.ctl { min-height: 36px; padding: 0 14px; border: 0; border-radius: 9999px; background: var(--card-2); color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; }
.ctl:hover { background: rgba(var(--qa-rgb), .22); }
.ctl[aria-pressed="true"] { background: var(--qa); color: #fff; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.v { min-width: 0; background: var(--card); border-radius: 20px; padding: 24px 24px 22px; }
.v-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.v-id { display: inline-grid; place-items: center; min-width: 38px; height: 30px; padding: 0 8px; border-radius: 9px; background: rgba(var(--qa-rgb), .2); color: var(--mine-text); font-weight: 800; font-size: 14px; }
h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.v-sum { margin-top: 8px; max-width: 78ch; color: var(--ink-2); font-size: 14px; }
.v-toggle { margin-left: 8px; min-height: 30px; padding: 0 12px; border: 0; border-radius: 9999px; background: var(--card-2); color: var(--ink-2); font-size: 12px; font-weight: 600; cursor: pointer; }
.v-toggle:hover { color: var(--ink); }

.stage { position: relative; isolation: isolate; display: flex; justify-content: center; align-items: center; min-height: 150px; margin: 18px 0 16px; padding: 30px 16px; border-radius: 14px; background: radial-gradient(70% 120% at 50% 0%, rgba(var(--qa-rgb), .18), transparent 70%), var(--page); overflow: hidden; }
.bar { position: relative; flex: 0 1 640px; min-width: 0; display: flex; align-items: center; gap: 10px; height: 54px; padding: 8px; border-radius: 40px; background: var(--bar); border: 1px solid var(--bar-border); box-shadow: 0 8px 32px rgba(0,0,0,.45); transition: border-color 220ms var(--ease); }
:root[data-theme="light"] .bar { box-shadow: 0 8px 32px rgba(16,24,40,.1); }
.stage.on .bar { border-color: rgba(var(--qa-rgb), .6); }
.ico { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: #11203a; color: #8fb4ff; }
.ico svg, .send svg { width: 18px; height: 18px; }
.ph { flex: 1; min-width: 0; color: var(--bar-ink); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hint { flex: none; color: var(--bar-ink); font-size: 12px; }
.stage.on .hint { display: none; }
.send { position: relative; z-index: 1; flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--qa); color: #fff; transition: background 220ms var(--ease), color 220ms var(--ease); }

/* The cap: the bar's right end. Off, it is just the send button. On, the
   scope grows out of it to the left (max-width, so the question field gives
   up exactly the room the scope takes). */
.cap { flex: none; display: flex; align-items: center; gap: 6px; height: 38px; margin-right: -1px; border-radius: 9999px; transition: background 220ms var(--ease), box-shadow 220ms var(--ease), padding 220ms var(--ease); }
.scope { display: flex; align-items: center; gap: 6px; max-width: 0; overflow: hidden; opacity: 0; visibility: hidden; white-space: nowrap; font-size: 11.5px; font-weight: 600; transition: max-width 240ms var(--ease), opacity 160ms var(--ease), visibility 0s linear 240ms; }
.stage.on .scope { max-width: 220px; opacity: 1; visibility: visible; transition-delay: 0s, 60ms, 0s; }
.av { display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; color: #5b2bbd; font-size: 8.5px; font-weight: 700; letter-spacing: .02em; }
.x { position: relative; display: inline-grid; place-items: center; flex: none; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--mine-text); cursor: pointer; }
.x::before { content: ""; position: absolute; inset: -6px; }
.x:hover { background: rgba(var(--qa-rgb), .3); }
.x svg { width: 12px; height: 12px; }

/* 5A. Tinted cap: the round-1 option 5, kept as the baseline. */
.a .stage.on .cap { padding-left: 4px; background: rgba(var(--qa-rgb), .22); }
.a .scope { color: var(--mine-text); }
.a .gap { width: 4px; }

/* 5B. Solid cap: the whole end turns solid violet; the send button inverts
   to white so it stays the strongest thing in the cap. */
.b .stage.on .cap { padding-left: 4px; background: var(--qa); }
.b .scope { color: #fff; }
.b .x { color: #fff; }
.b .x:hover { background: rgba(255,255,255,.2); }
.b .stage.on .send { background: #fff; color: var(--qa-deep); }

/* 5C. Avatar on send: your avatar stacks onto the send button like an
   avatar group, so it reads "send, as me". The label sits before them. */
.c .stage.on .cap { padding-left: 10px; background: rgba(var(--qa-rgb), .22); }
.c .scope { color: var(--mine-text); }
.c .scope .av { display: none; }
.c .stack-av { position: relative; z-index: 2; display: inline-grid; place-items: center; width: 0; height: 26px; margin-right: 0; border-radius: 50%; background: #fff; color: #5b2bbd; font-size: 9px; font-weight: 700; box-shadow: 0 0 0 3px var(--bar); opacity: 0; transition: width 240ms var(--ease), margin 240ms var(--ease), opacity 160ms var(--ease); overflow: hidden; }
.c .stage.on .stack-av { width: 26px; margin-right: -12px; opacity: 1; box-shadow: 0 0 0 3px #2a2340; }
:root[data-theme="light"] .c .stage.on .stack-av { box-shadow: 0 0 0 3px #eee6fd; }

/* 5D. Split cap: two violet segments, scope and send, with a 3px gap of
   bar colour between them instead of a line. Reads as one control with two
   parts, like a split button. */
.d .stage.on .cap { gap: 3px; }
.d .scope { height: 38px; padding: 0 0 0 0; border-radius: 9999px 6px 6px 9999px; background: rgba(var(--qa-rgb), .26); color: var(--mine-text); }
.d .stage.on .scope { padding: 0 6px 0 4px; }
.d .stage.on .send { border-radius: 6px 9999px 9999px 6px; width: 42px; height: 38px; }

/* 5E. Inset well: the cap is pressed into the bar, a recessed violet well
   with the scope as a raised chip in it. Depth instead of colour. */
.e .stage.on .cap { padding-left: 4px; background: var(--well); box-shadow: inset 0 2px 4px rgba(0,0,0,.45); }
:root[data-theme="light"] .e .stage.on .cap { box-shadow: inset 0 2px 4px rgba(60,20,140,.18); }
.e .scope .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 3px; border-radius: 9999px; background: var(--qa); color: #fff; box-shadow: 0 2px 6px -2px rgba(0,0,0,.5); }
.e .scope .x { color: var(--mine-text); }

/* 5F. Addressed to: like a recipient field, a muted "For" before the chip,
   so the question reads as addressed to your own data. */
.f .stage.on .cap { padding-left: 12px; background: rgba(var(--qa-rgb), .16); }
.f .for { color: var(--ink-3); font-weight: 500; }
:root:not([data-theme="light"]) .f .for { color: #b0a3c9; }
.f .chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 4px 0 2px; border-radius: 9999px; background: var(--qa); color: #fff; }
.f .chip .x { width: 18px; height: 18px; color: #fff; }
.f .chip .x:hover { background: rgba(255,255,255,.22); }

.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 28px; font-size: 13.5px; color: var(--ink-2); }
.notes b { display: block; color: var(--ink); font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.notes ul { padding-left: 18px; }
.refs { margin-top: 12px; font-size: 12.5px; color: var(--ink-3); }
.refs a { color: var(--mine-text); text-underline-offset: 3px; }

@media (max-width: 760px) {
  .wrap { padding: 36px 16px 64px; }
  .v { padding: 18px 16px; }
  .hint { display: none; }
  .ph { font-size: 13px; }
  .t, .for { display: none; }
  .e .scope .chip { padding-right: 3px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0ms !important; transition-delay: 0ms !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>End cap, six ways</h1>
      <p class="lede">Option 5 from the <a href="my-results-badge-variants.html">first sheet</a>: the composer's own right end holds "Only my results" with the send button, so the scope travels with every question. Each variant changes one thing: fill, how the avatar meets send, separation, depth or wording. All are live; switch them off and on.</p>
    </div>
    <div class="controls">
      <button class="ctl" type="button" id="themeBtn" aria-pressed="false">Light theme</button>
      <button class="ctl" type="button" id="replayAll">Replay all</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<template id="barTpl">
  <div class="bar">
    <span class="ico" aria-hidden="true"><svg class="lucide lucide-sparkles" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></svg></span>
    <span class="ph">Ask AiMY anything, or describe what you'd like to filter…</span>
    <span class="hint">Enter to send</span>
    <span class="cap"></span>
  </div>
</template>

<script>
(function () {
  "use strict";
  var X = '<svg class="lucide lucide-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
  var SEND = '<span class="send" aria-hidden="true"><svg class="lucide lucide-send-horizontal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.714 3.048a.498.498 0 0 0-.683.627l2.843 7.627a2 2 0 0 1 0 1.396l-2.842 7.627a.498.498 0 0 0 .682.627l18-8.5a.5.5 0 0 0 0-.904z"/><path d="M6 12h16"/></svg></span>';
  var AV = '<span class="av" aria-hidden="true">EY</span>';
  var XB = '<button class="x" type="button" data-off aria-label="Show everyone’s results">' + X + "</button>";
  function mob(id, title) { return '<a href="https://mobbin.com/screens/' + id + '" target="_blank" rel="noopener">' + title + "</a>"; }
  var BASE_REFS = mob("62284ada-24ea-4033-8b3a-92ecc11f028e", "ClickUp, source scope in the composer") + ", " + mob("e2f12dd6-645c-4903-86f8-f92d428acfc4", "Perplexity, mode in the composer");

  var V = [
    { k: "a", id: "5A", title: "Tinted cap",
      sum: "The baseline from round 1. The end of the bar takes a soft violet tint and gathers your avatar, Only mine and × in front of the send button.",
      cap: '<span class="scope" role="status">' + AV + '<span class="t">Only mine</span>' + XB + '<span class="gap"></span></span>' + SEND,
      pro: ["Quietest of the six; the violet theme carries the rest", "Nothing new to learn: avatar, words, ×"],
      con: ["The tint is close to the bar in light theme", "Avatar and send are two circles side by side, a little busy"],
      refs: BASE_REFS },
    { k: "b", id: "5B", title: "Solid cap",
      sum: "The whole end turns solid violet, and the send button inverts to white so it stays the strongest thing in it. Unmissable at a glance, like a private-mode tab.",
      cap: '<span class="scope" role="status">' + AV + '<span class="t">Only mine</span>' + XB + "</span>" + SEND,
      pro: ["Loudest: impossible to miss which mode you're in", "The inverted send is a clear signal that sending is scoped"],
      con: ["Send changes colour, which may read as a different action", "A large solid block on every page"],
      refs: BASE_REFS + ", " + mob("7eb893f8-3293-4163-82f4-204a5acc1fa7", "Opera, private mode") },
    { k: "c", id: "5C", title: "Avatar on send",
      sum: "Your avatar stacks onto the send button like an avatar group, ringed so the two overlap cleanly, with Only mine before them. Reads as send, as me.",
      cap: '<span class="scope" role="status"><span class="t">Only mine</span>' + XB + '</span><span class="stack-av" aria-hidden="true">EY</span>' + SEND,
      pro: ["Ties the scope to the act of sending, not just the bar", "Saves room: avatar and send share a footprint"],
      con: ["The avatar partly covers the send icon's circle", "Overlapping circles need care at small sizes"],
      refs: BASE_REFS + ", " + mob("4faf4fee-bfbd-4ff5-b811-a0f8655c8138", "Delphi, avatar puck") },
    { k: "d", id: "5D", title: "Split cap",
      sum: "Two violet segments, scope and send, separated by a 3px gap of bar colour instead of a line. One control with two parts, like a split button: the scope and the send it applies to.",
      cap: '<span class="scope" role="status">' + AV + '<span class="t">Only mine</span>' + XB + "</span>" + SEND,
      pro: ["The clearest structure: scope | send", "Send keeps its size and colour; nothing changes meaning"],
      con: ["Send loses its round shape while the mode is on", "Split buttons usually mean 'send with options', a slight mismatch"],
      refs: BASE_REFS + ", " + mob("0858df95-ec2b-4f7e-acd8-77bf1a0bf43a", "Devin, structured filter token") },
    { k: "e", id: "5E", title: "Inset well",
      sum: "The end of the bar is pressed in, a recessed dark-violet well, and the scope sits in it as a raised solid chip. Depth says 'set into the bar' instead of more colour.",
      cap: '<span class="scope" role="status"><span class="chip">' + AV + '<span class="t">Only mine</span></span>' + XB + "</span>" + SEND,
      pro: ["Feels physically attached, like a switch set into a panel", "The solid chip matches the filter-row chip"],
      con: ["Inset shadows are new to this design system", "Subtle in light theme"],
      refs: BASE_REFS + ", " + mob("0271ec95-9287-4a75-bfcd-4b4e5b6e59a5", "Tana, solid person chip") },
    { k: "f", id: "5F", title: "Addressed to",
      sum: "Like a recipient field: a muted For before a solid chip with your avatar and name, and the × inside the chip. The question reads as addressed to your own data.",
      cap: '<span class="scope" role="status"><span class="for">For</span><span class="chip">' + AV + '<span class="t">Only mine</span>' + XB + "</span></span>" + SEND,
      pro: ["Explains itself: the question is for you", "The chip with × inside is a pattern people know from email"],
      con: ["One more word on screen", "The muted 'For' needs care to stay readable"],
      refs: BASE_REFS + ", " + mob("0858df95-ec2b-4f7e-acd8-77bf1a0bf43a", "Devin, Creator is [person]") }
  ];

  var grid = document.getElementById("grid"), tpl = document.getElementById("barTpl");
  V.forEach(function (v) {
    var art = document.createElement("article");
    art.className = "v " + v.k;
    art.innerHTML =
      '<div class="v-head"><span class="v-id">' + v.id + "</span><h2>" + v.title + "</h2>" +
      '<button class="v-toggle" type="button" data-toggle aria-pressed="true">Switch off</button></div>' +
      '<p class="v-sum">' + v.sum + "</p>" +
      '<div class="stage on"></div>' +
      '<div class="notes"><div><b>Strong</b><ul>' + v.pro.map(function (p) { return "<li>" + p + "</li>"; }).join("") + "</ul></div>" +
      '<div><b>Weak</b><ul>' + v.con.map(function (p) { return "<li>" + p + "</li>"; }).join("") + "</ul></div></div>" +
      '<p class="refs">References on Mobbin: ' + v.refs + "</p>";
    var stage = art.querySelector(".stage");
    stage.appendChild(tpl.content.cloneNode(true));
    stage.querySelector(".cap").innerHTML = v.cap;
    grid.appendChild(art);
  });

  function setOn(art, on) {
    art.querySelector(".stage").classList.toggle("on", on);
    var t = art.querySelector("[data-toggle]");
    t.setAttribute("aria-pressed", String(on));
    t.textContent = on ? "Switch off" : "Switch on";
  }
  grid.addEventListener("click", function (e) {
    var art = e.target.closest(".v");
    if (!art) return;
    if (e.target.closest("[data-off]")) setOn(art, false);
    else if (e.target.closest("[data-toggle]")) setOn(art, !art.querySelector(".stage").classList.contains("on"));
  });
  document.getElementById("replayAll").addEventListener("click", function () {
    var arts = grid.querySelectorAll(".v");
    arts.forEach(function (a) { setOn(a, false); });
    setTimeout(function () { arts.forEach(function (a) { setOn(a, true); }); }, 420);
  });
  var themeBtn = document.getElementById("themeBtn");
  themeBtn.addEventListener("click", function () {
    var light = document.documentElement.getAttribute("data-theme") !== "light";
    if (light) document.documentElement.setAttribute("data-theme", "light");
    else document.documentElement.removeAttribute("data-theme");
    themeBtn.setAttribute("aria-pressed", String(light));
  });
})();
</script>
</body>
</html>
