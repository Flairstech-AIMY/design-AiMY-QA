<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tinted Cap Variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Round 3 of the composer badge (AIMY-2423): six versions of 5A, the
   Tinted cap. The bar's right end takes a soft violet tint and holds the
   scope in front of the send button. Each version answers a weakness of
   5A: two circles side by side read busy, and the tint is faint in light
   theme. Same composer geometry as the product. */
:root {
  --qa: #8b4ff4; --qa-rgb: 139, 79, 244; --mine-text: #c9b0ff;
  --page: #16121d; --card: #1a1524; --card-2: #231b30; --ink: #f5f7fb; --ink-2: #c3ceda; --ink-3: #93a2b4;
  --bar: #1e2428; --bar-border: rgba(255,255,255,.1); --bar-ink: #a8b5c5;
  --tint: rgba(139, 79, 244, .22); --tint-strong: rgba(139, 79, 244, .32);
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --mine-text: #5b2bbf;
  --page: #f6f2fd; --card: #ffffff; --card-2: #faf7fe; --ink: #10151b; --ink-2: #2a3540; --ink-3: #566472;
  --bar: #ffffff; --bar-border: rgba(16,24,40,.14); --bar-ink: #566472;
  --tint: rgba(139, 79, 244, .13); --tint-strong: rgba(139, 79, 244, .2);
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--page); color: var(--ink); font-family: "Poppins", system-ui, sans-serif; line-height: 1.5; }
::selection { background: rgba(var(--qa-rgb), .35); }
button { font: inherit; }
button:focus-visible { outline: 2px solid var(--mine-text); outline-offset: 2px; }

.wrap { max-width: 1120px; margin: 0 auto; padding: 56px 24px 96px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 40px; }
h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.lede { max-width: 64ch; margin-top: 10px; color: var(--ink-2); font-size: 15px; }
.lede a { color: var(--mine-text); text-underline-offset: 3px; }
.controls { display: flex; gap: 8px; }
.ctl { min-height: 36px; padding: 0 14px; border: 0; border-radius: 9999px; background: var(--card-2); color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; }
.ctl:hover { background: rgba(var(--qa-rgb), .22); }
.ctl[aria-pressed="true"] { background: var(--qa); color: #fff; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.v { min-width: 0; background: var(--card); border-radius: 20px; padding: 24px 24px 22px; }
.v-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.v-id { display: inline-grid; place-items: center; min-width: 38px; height: 30px; padding: 0 8px; border-radius: 9px; background: rgba(var(--qa-rgb), .2); color: var(--mine-text); font-weight: 800; font-size: 14px; }
h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.v-sum { margin-top: 8px; max-width: 78ch; color: var(--ink-2); font-size: 14px; }
.v-toggle { margin-left: 8px; min-height: 30px; padding: 0 12px; border: 0; border-radius: 9999px; background: var(--card-2); color: var(--ink-2); font-size: 12px; font-weight: 600; cursor: pointer; }
.v-toggle:hover { color: var(--ink); }

.stage { position: relative; isolation: isolate; display: flex; justify-content: center; align-items: center; min-height: 150px; margin: 18px 0 16px; padding: 30px 16px; border-radius: 14px; background: radial-gradient(70% 120% at 50% 0%, rgba(var(--qa-rgb), .18), transparent 70%), var(--page); overflow: hidden; }
.bar { position: relative; flex: 0 1 640px; min-width: 0; display: flex; align-items: center; gap: 10px; height: 54px; padding: 8px; border-radius: 40px; background: var(--bar); border: 1px solid var(--bar-border); box-shadow: 0 8px 32px rgba(0,0,0,.45); transition: border-color 220ms var(--ease); }
:root[data-theme="light"] .bar { box-shadow: 0 8px 32px rgba(16,24,40,.1); }
.stage.on .bar { border-color: rgba(var(--qa-rgb), .6); }
.ico { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: #11203a; color: #8fb4ff; }
.ico svg, .send svg { width: 18px; height: 18px; }
.ph { flex: 1; min-width: 0; color: var(--bar-ink); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hint { flex: none; color: var(--bar-ink); font-size: 12px; }
.stage.on .hint { display: none; }
.send { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--qa); color: #fff; }

/* The cap. The scope's reveal animates a grid column (0fr → 1fr) and its
   opacity, so no layout size is animated directly. */
.cap { flex: none; display: flex; align-items: center; height: 38px; margin-right: -1px; border-radius: 9999px; transition: background-color 220ms var(--ease), box-shadow 220ms var(--ease); }
.reveal { display: grid; grid-template-columns: 0fr; transition: grid-template-columns 240ms var(--ease); }
.stage.on .reveal { grid-template-columns: 1fr; }
.scope { min-width: 0; overflow: hidden; display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 11.5px; font-weight: 600; color: var(--mine-text); opacity: 0; transition: opacity 140ms var(--ease); }
.stage.on .scope { opacity: 1; transition: opacity 200ms var(--ease) 60ms; }
.stage.on .cap { background: var(--tint); }
.scope > :first-child { margin-left: 4px; }
.scope > :last-child { margin-right: 6px; }
.av { display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; color: #5b2bbd; font-size: 8.5px; font-weight: 700; letter-spacing: .02em; }
/* A white avatar disappears on the pale light-theme tint; there it inverts. */
:root[data-theme="light"] .av,
:root[data-theme="light"] .t2 .avx { background: var(--qa); color: #fff; }
.x { position: relative; display: inline-grid; place-items: center; flex: none; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--mine-text); cursor: pointer; }
.x::before { content: ""; position: absolute; inset: -6px; }
.x:hover { background: rgba(var(--qa-rgb), .3); }
.x svg { width: 12px; height: 12px; }

/* T1. Words only: no avatar, so send is the only circle in the cap. */
.t1 .scope > :first-child { margin-left: 12px; }

/* T2. Avatar is the ×: one circle that is both "you" and the way back. On
   hover or focus the initials swap to an × in place. */
.t2 .scope > :first-child { margin-left: 10px; }
.t2 .avx { position: relative; display: inline-grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; background: #fff; color: #5b2bbd; font-size: 8.5px; font-weight: 700; cursor: pointer; }
.t2 .avx::before { content: ""; position: absolute; inset: -5px; }
.t2 .avx .i, .t2 .avx svg { grid-area: 1 / 1; transition: opacity 120ms var(--ease), transform 160ms var(--ease); }
.t2 .avx svg { width: 12px; height: 12px; opacity: 0; transform: scale(.6); }
.t2 .avx:hover, .t2 .avx:focus-visible { background: var(--qa); color: #fff; }
.t2 .avx:hover .i, .t2 .avx:focus-visible .i { opacity: 0; transform: scale(.6); }
.t2 .avx:hover svg, .t2 .avx:focus-visible svg { opacity: 1; transform: none; }

/* T3. Defined edge: the tint gets an inner violet ring, so the cap reads as
   a shape in its own right, and holds up in light theme. */
.t3 .stage.on .cap { background: var(--tint); box-shadow: inset 0 0 0 1px rgba(var(--qa-rgb), .55); }

/* T4. Status dot: a small solid violet dot and the full phrase, like a
   presence or recording indicator, instead of a second circle. */
.t4 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--qa); box-shadow: 0 0 0 3px rgba(var(--qa-rgb), .28); }
.t4 .scope > :first-child { margin-left: 12px; }

/* T5. Icon, not initials: the filter chip's own person icon, so the cap and
   the chip in the filter row speak the same visual language. */
.t5 .pi { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: rgba(var(--qa-rgb), .35); color: var(--mine-text); }
.t5 .pi svg { width: 13px; height: 13px; }

/* T6. Contained capsule: the tint becomes a full capsule with equal padding
   all round, and send shrinks a little to sit inside it, so avatar, words,
   × and send read as one object. */
.t6 .stage.on .cap { padding: 0 3px 0 0; background: var(--tint-strong); }
/* The avatar IS the capsule's left end: full height, flush to the edge, so
   its curve is the pill's own rounded end rather than a circle inside it. */
.t6 .scope { gap: 7px; }
.t6 .scope > .av:first-child { margin-left: 0; width: 38px; height: 38px; font-size: 12px; letter-spacing: .03em; }
/* Blended: the avatar is a deeper step of the pill's own violet with
   violet initials, so it reads as the pill's end, not a sticker on it. */
.t6 .scope > .av:first-child,
:root[data-theme="light"] .t6 .scope > .av:first-child { background: rgba(var(--qa-rgb), .36); color: var(--mine-text); }
:root[data-theme="light"] .t6 .scope > .av:first-child { background: rgba(var(--qa-rgb), .22); }
/* T6 photo: a stock portrait at the pill's left end, no ring. Sample image: Unsplash,
   Jake Nackos, Unsplash License (stand-in for the signed-in person's photo). */
.t6 .scope > .av.photo:first-child,
:root[data-theme="light"] .t6 .scope > .av.photo:first-child {
  background: url("assets/avatar-sample-unsplash-jakenackos.jpg") center / cover no-repeat;
  color: transparent;
  /* Same size and inset as send (32px, 3px from the end), so the two ends
     of the capsule mirror each other. */
  width: 32px;
  height: 32px;
  margin-left: 3px;
  box-shadow: none;
}
.credit { margin-top: 6px; font-size: 12px; color: var(--ink-3); }
.credit a { color: var(--mine-text); text-underline-offset: 3px; }
/* T6b. Mirrors send: the avatar takes send's solid violet, so the two ends
   of the capsule are a matched pair. */
.t6b .scope > .av:first-child,
:root[data-theme="light"] .t6b .scope > .av:first-child { background: var(--qa); color: #fff; }
/* T6c. Initials only: no circle at all; the initials sit in the pill's
   rounded end, and the end itself is the avatar. */
.t6c .scope > .av:first-child,
:root[data-theme="light"] .t6c .scope > .av:first-child { background: transparent; color: var(--mine-text); font-size: 12.5px; font-weight: 800; width: 34px; }
.t6c .scope { gap: 4px; }
.t6 .stage.on .send { width: 32px; height: 32px; }
.t6 .send { transition: width 0s, height 0s; }

.ts { display: none; }
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 28px; font-size: 13.5px; color: var(--ink-2); }
.notes b { display: block; color: var(--ink); font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.notes ul { padding-left: 18px; }

@media (max-width: 760px) {
  .wrap { padding: 36px 16px 64px; }
  .v { padding: 18px 16px; }
  .hint { display: none; }
  .ph { font-size: 13px; }
  .t { display: none; }
  .ts { display: inline; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0ms !important; transition-delay: 0ms !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Tinted cap versions</h1>
      <p class="lede">Iterations on 5A from the <a href="my-results-endcap-variants.html">End cap sheet</a>: the bar's end takes a soft violet tint and holds the scope in front of send. Each version answers 5A's two weaknesses, two circles side by side and a faint tint in light theme. All are live; switch them off and on, and try both themes.</p>
    </div>
    <div class="controls">
      <button class="ctl" type="button" id="themeBtn" aria-pressed="false">Light theme</button>
      <button class="ctl" type="button" id="replayAll">Replay all</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<template id="barTpl">
  <div class="bar">
    <span class="ico" aria-hidden="true"><svg class="lucide lucide-sparkles" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></svg></span>
    <span class="ph">Ask AiMY anything, or describe what you'd like to filter…</span>
    <span class="hint">Enter to send</span>
    <span class="cap"><span class="reveal"><span class="scope" role="status"></span></span><span class="send" aria-hidden="true"><svg class="lucide lucide-send-horizontal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.714 3.048a.498.498 0 0 0-.683.627l2.843 7.627a2 2 0 0 1 0 1.396l-2.842 7.627a.498.498 0 0 0 .682.627l18-8.5a.5.5 0 0 0 0-.904z"/><path d="M6 12h16"/></svg></span></span>
  </div>
</template>

<script>
(function () {
  "use strict";
  var X = '<svg class="lucide lucide-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
  var USER = '<svg class="lucide lucide-user-round" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>';
  var AV = '<span class="av" aria-hidden="true">EY</span>';
  var XB = '<button class="x" type="button" data-off aria-label="Show everyone’s results">' + X + "</button>";

  var V = [
    { k: "t1", id: "T1", title: "Words only",
      sum: "The avatar goes. The tint holds just Only mine and the ×, so send is the only circle in the cap and nothing competes with it.",
      scope: '<span class="t">Only mine</span><span class="ts">Mine</span>' + XB,
      pro: ["Calmest version; fixes 'two circles side by side'", "Narrowest: about 140px including send"],
      con: ["Loses the 'this is you' cue of the avatar", "Relies on the pill and the violet theme to say whose results"] },
    { k: "t2", id: "T2", title: "Avatar is the ×",
      sum: "One circle does both jobs: your initials say whose results these are, and on hover or keyboard focus they turn into an × in place. Click it to show everyone's.",
      scope: '<span class="t">Only mine</span><button class="avx" type="button" data-off aria-label="Only my results. Show everyone’s results" title="Show everyone’s results"><span class="i" aria-hidden="true">EY</span>' + X + "</button>",
      pro: ["Fewest parts: words, one circle, send", "The 'you' and the way back sit in one place"],
      con: ["The × is hidden until hover or focus, so touch users get no hint", "A circle that changes on hover can surprise"] },
    { k: "t3", id: "T3", title: "Defined edge",
      sum: "5A as it is, with an inner violet ring on the tint, so the cap reads as a shape of its own and holds up in light theme.",
      scope: AV + '<span class="t">Only mine</span>' + XB,
      pro: ["Fixes the faint tint in light theme", "Closest to 5A; the smallest change"],
      con: ["Adds a line, where the system prefers tone steps", "Still two circles side by side"] },
    { k: "t4", id: "T4", title: "Status dot",
      sum: "A small solid violet dot and the full phrase Only my results, like a presence or recording light, instead of a second circle. The dot is the state; the words say what it is.",
      scope: '<span class="dot" aria-hidden="true"></span><span class="t">Only my results</span>' + XB,
      pro: ["Matches the filter chip's exact words", "A dot reads as 'mode on' everywhere"],
      con: ["Widest of the six (about 170px)", "No personal cue: it could be any mode"] },
    { k: "t5", id: "T5", title: "Person icon",
      sum: "The filter chip's own person icon in a soft violet disc instead of white initials, so the cap and the chip in the filter row speak the same language. Lighter than the white avatar.",
      scope: '<span class="pi" aria-hidden="true">' + USER + '</span><span class="t">Only mine</span>' + XB,
      pro: ["Consistent with the chip and the Lucide icon set", "The soft disc is quieter than a white avatar"],
      con: ["Generic: an icon, not you", "Still a circle beside the send circle, though a quiet one"] },
    { k: "t6", id: "T6", title: "Contained capsule",
      sum: "The tint becomes a full capsule with your profile photo at its left end and send at its right, the same size and inset, so the two ends mirror each other.",
      scope: '<span class="av photo" role="img" aria-label="Engy Yasser"></span><span class="t">Only mine</span>' + XB,
      credit: 'Sample photo by <a href="https://unsplash.com/photos/woman-in-white-crew-neck-shirt-smiling-IF9TK5Uy-KI" target="_blank" rel="noopener">Jake Nackos on Unsplash</a> (Unsplash License), standing in for the signed-in person\'s own photo.',
      pro: ["A real face is recognised faster than initials", "The photo is the pill's end, not a sticker on it"],
      con: ["Depends on people uploading a photo; needs the initials fallback", "Photos vary in brightness; a light photo stands out against the tint"] },
    { k: "t6 t6b", id: "T6b", title: "Contained capsule, mirrors send",
      sum: "Same capsule, but the avatar takes send's solid violet, so the two ends are a matched pair of solid circles with the words between them.",
      scope: AV + '<span class="t">Only mine</span>' + XB,
      pro: ["Symmetric: two solid ends frame the words", "The avatar is as strong as the send button"],
      con: ["Two solid violet circles can read as two buttons", "The heaviest blend of the three"] },
    { k: "t6 t6c", id: "T6c", title: "Contained capsule, initials only",
      sum: "No avatar circle at all: your initials sit in the pill's rounded left end, so the end of the pill is the avatar. The lightest blend.",
      scope: AV + '<span class="t">Only mine</span>' + XB,
      pro: ["Fully blended; nothing sits on top of the pill", "Fixes 'two circles side by side' completely"],
      con: ["Initials without a circle are less recognisable as a person", "Relies on the tint for the end's shape"] }
  ];

  var grid = document.getElementById("grid"), tpl = document.getElementById("barTpl");
  V.forEach(function (v) {
    var art = document.createElement("article");
    art.className = "v " + v.k;
    art.innerHTML =
      '<div class="v-head"><span class="v-id">' + v.id + "</span><h2>" + v.title + "</h2>" +
      '<button class="v-toggle" type="button" data-toggle aria-pressed="true">Switch off</button></div>' +
      '<p class="v-sum">' + v.sum + "</p>" +
      '<div class="stage on"></div>' +
      '<div class="notes"><div><b>Strong</b><ul>' + v.pro.map(function (p) { return "<li>" + p + "</li>"; }).join("") + "</ul></div>" +
      '<div><b>Weak</b><ul>' + v.con.map(function (p) { return "<li>" + p + "</li>"; }).join("") + "</ul></div></div>" +
      (v.credit ? '<p class="credit">' + v.credit + "</p>" : "");
    var stage = art.querySelector(".stage");
    stage.appendChild(tpl.content.cloneNode(true));
    stage.querySelector(".scope").innerHTML = v.scope;
    grid.appendChild(art);
  });

  function setOn(art, on) {
    art.querySelector(".stage").classList.toggle("on", on);
    var t = art.querySelector("[data-toggle]");
    t.setAttribute("aria-pressed", String(on));
    t.textContent = on ? "Switch off" : "Switch on";
  }
  grid.addEventListener("click", function (e) {
    var art = e.target.closest(".v");
    if (!art) return;
    if (e.target.closest("[data-off]")) setOn(art, false);
    else if (e.target.closest("[data-toggle]")) setOn(art, !art.querySelector(".stage").classList.contains("on"));
  });
  document.getElementById("replayAll").addEventListener("click", function () {
    var arts = grid.querySelectorAll(".v");
    arts.forEach(function (a) { setOn(a, false); });
    setTimeout(function () { arts.forEach(function (a) { setOn(a, true); }); }, 420);
  });
  var themeBtn = document.getElementById("themeBtn");
  themeBtn.addEventListener("click", function () {
    var light = document.documentElement.getAttribute("data-theme") !== "light";
    if (light) document.documentElement.setAttribute("data-theme", "light");
    else document.documentElement.removeAttribute("data-theme");
    themeBtn.setAttribute("aria-pressed", String(light));
  });
})();
</script>
</body>
</html>
