  function data() { return datasets[state.interactionKey]; }
  function decisionKey(kpiId) { return state.interactionKey + ':' + kpiId; }
  function decisionFor(kpi) { return state.decisions[decisionKey(kpi.id)] || null; }
  function finalVerdict(kpi) {
    const d = decisionFor(kpi);
    if (!d) return kpi.verdict;
    if (d.type === 'agree') return kpi.verdict;
    if (d.type === 'na') return 'na';
    if (d.type === 'disagree') return d.corrected;
    return kpi.verdict;
  }
  function disputeFor(kpi) { return state.disputes[decisionKey(kpi.id)] || kpi.dispute || null; }
  function scoreMetaFor(dataset, override = null) {
    let passWeight = 0;
    let scorableWeight = 0;
    let resolvedWeight = 0;
    const totalWeight = dataset.kpis.reduce((sum,k) => sum + k.weight, 0);
    dataset.kpis.forEach(kpi => {
      const verdict = override && override.kpiId === kpi.id ? override.verdict : finalVerdict(kpi);
      if (verdict !== 'pending') resolvedWeight += kpi.weight;
      if (verdict === 'pass' || verdict === 'fail') scorableWeight += kpi.weight;
      if (verdict === 'pass') passWeight += kpi.weight;
    });
    return {
      score: scorableWeight > 0 ? Math.round(passWeight / scorableWeight * 100) : 0,
      passWeight,
      scorableWeight,
      totalWeight,
      coverage: totalWeight > 0 ? Math.round(resolvedWeight / totalWeight * 100) : 0
    };
  }
  function scoreFor(dataset) { return scoreMetaFor(dataset).score; }
  function completionState() {
    const outstanding = data().kpis.filter(kpi => !decisionFor(kpi) || finalVerdict(kpi) === 'pending');
    return { outstanding, ready: outstanding.length === 0 };
  }

  function verdictLabel(v) {
    return ({pass:'Pass',fail:'Fail',pending:'Unscored',na:'N/A'})[v] || v;
  }
  function statusSymbol(v) {
    return v === 'pass' ? '✓' : v === 'fail' ? '×' : v === 'na' ? '–' : '?';
  }

  function currentCounts() {
    const counts = {pass:0,fail:0,pending:0,na:0,settled:0};
    data().kpis.forEach(k => {
      const v = finalVerdict(k);
      counts[v] = (counts[v] || 0) + 1;
      if (decisionFor(k) || state.role !== 'auditor' || k.verdict !== 'pending') counts.settled++;
    });
    return counts;
  }

  function renderHeader() {
    const d = data();
    const meta = scoreMetaFor(d);
    const finalized = state.completed[state.interactionKey] || (state.role !== 'auditor' && d.delivered && meta.coverage === 100);
    const status = !finalized || meta.coverage < 100 ? 'pending' : meta.score >= PASS_THRESHOLD ? 'pass' : 'fail';
    els.pageTitle.textContent = d.title;
    els.headStatus.className = 'status-chip ' + status;
    els.headStatus.textContent = status === 'pass' ? 'Pass' : status === 'fail' ? 'Fail' : meta.coverage < 100 ? 'Provisional' : 'In review';
  }

  function renderSummary() {
    const d = data();
    const counts = currentCounts();
    const meta = scoreMetaFor(d);
    els.scoreValue.textContent = meta.score + '%';
    const provisional = meta.coverage < 100;
    els.scoreLabel.textContent = provisional ? 'Provisional score' : 'Quality score';
    const completed = Boolean(state.completed[state.interactionKey]);
    els.scoreState.textContent = completed ? 'Completed' : provisional ? 'In review' : state.role === 'auditor' ? 'Reviewing' : 'Final';
    els.scoreState.classList.toggle('complete', completed || (state.role !== 'auditor' && !provisional));
    els.scoreFormula.innerHTML = '<strong>' + meta.passWeight + '</strong> passed pts ÷ <strong>' + meta.scorableWeight + '</strong> scorable pts · ' + meta.coverage + '% coverage · ' + PASS_THRESHOLD + '% pass threshold';
    const reviewed = d.kpis.filter(k => decisionFor(k)).length;
    els.settledCopy.textContent = reviewed + ' reviewed · ' + (d.kpis.length - reviewed) + ' remaining';
    els.summaryStats.innerHTML =
      '<span class="stat"><span class="dot ok"></span><span class="stat-label">Passed</span><strong>' + counts.pass + '</strong></span>' +
      '<span class="stat"><span class="dot err"></span><span class="stat-label">Failed</span><strong>' + counts.fail + '</strong></span>' +
      (counts.pending ? '<span class="stat"><span class="dot warn"></span><span class="stat-label">Unscored</span><strong>' + counts.pending + '</strong></span>' : '') +
      (counts.na ? '<span class="stat"><span class="dot"></span><span class="stat-label">N/A</span><strong>' + counts.na + '</strong></span>' : '');
    els.confidenceValue.textContent = d.confidence + '%';
    els.confidenceBar.style.width = d.confidence + '%';

    const completion = completionState();
    els.completeAuditBtn.disabled = !completion.ready || completed;
    els.agreeAllBtn.disabled = completed || completion.outstanding.length === 0;
    els.completionHint.className = 'completion-hint auditor-only ' + (completion.ready ? 'ready' : 'blocked');
    if (completed) els.completionHint.textContent = 'Audit completed';
    else if (completion.ready) els.completionHint.textContent = 'All KPIs reviewed · Ready to complete';
    else els.completionHint.textContent = completion.outstanding.length + ' KPI' + (completion.outstanding.length === 1 ? '' : 's') + ' remaining';

    els.roleNote.innerHTML = '';
    els.roleNote.style.display = 'none';
  }

  function sortedKpis() {
    const items = [...data().kpis];
    if (state.sort === 'weight') items.sort((a,b) => b.weight - a.weight);
    else if (state.sort === 'action') items.sort((a,b) => {
      const ad = decisionFor(a) ? 1 : 0;
      const bd = decisionFor(b) ? 1 : 0;
      const av = a.verdict === 'fail' ? 0 : a.verdict === 'pending' ? .5 : 1;
      const bv = b.verdict === 'fail' ? 0 : b.verdict === 'pending' ? .5 : 1;
      return (ad + av) - (bd + bv);
    });
    return items;
  }

  function filterMatches(kpi) {
    const v = finalVerdict(kpi);
    if (state.filter === 'all') return true;
    if (state.filter === 'needs') return !decisionFor(kpi) || finalVerdict(kpi) === 'pending';
    if (state.filter === 'dispute') return Boolean(disputeFor(kpi));
    return v === state.filter;
  }

  function renderKpis() {
    const d = data();
    els.kpiList.innerHTML = '';
    let visibleCount = 0;
    sortedKpis().forEach((kpi, index) => {
      const card = document.createElement('article');
      card.dataset.kpiId = kpi.id;
      const final = finalVerdict(kpi);
      const decision = decisionFor(kpi);
      const visibleVerdict = decision ? final : kpi.verdict;
      const evidence = kpi.evidence.filter(isEvidenceVisible).map(staticEvidenceMarkup).join('');
      const dispute = disputeFor(kpi);
      const openDispute = dispute && dispute.status === 'open';
      const defaultOpen = visibleVerdict !== 'pass' || openDispute;
      const expanded = state.expandedKpis.has(kpi.id) || (defaultOpen && !state.collapsedKpis.has(kpi.id));
      const visible = filterMatches(kpi);
      if (visible) visibleCount++;
      card.className = 'kpi-card' + (decision ? ' is-reviewed' : '') + (visible ? '' : ' is-hidden') + (expanded ? '' : ' is-collapsed') + (openDispute ? ' has-open-dispute' : '');

      card.innerHTML =
        '<div class="kpi-card-head">' +
          '<span class="verdict-symbol ' + visibleVerdict + '">' + statusSymbol(visibleVerdict) + '</span>' +
          '<div class="kpi-heading"><div class="kpi-title-row"><h2 class="kpi-title">' + escapeHtml(kpi.title) + '</h2><span class="kpi-code">' + escapeHtml(kpi.code) + '</span></div><p class="kpi-question">' + escapeHtml(kpi.question) + '</p></div>' +
          '<div class="kpi-head-right">' +
            (decision ? '<span class="verdict-chip manual">Manual ' + verdictLabel(final) + '</span>' : '<span class="verdict-chip ' + kpi.verdict + '">AiMY ' + verdictLabel(kpi.verdict) + '</span>') +
            '<span class="weight">' + kpi.weight + ' pts</span>' +
            '<button class="card-toggle" type="button" data-card-toggle aria-expanded="' + expanded + '">' + (expanded ? 'Hide details' : 'Show details') + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="kpi-body">' +
          '<div class="ai-reading ai-private"><p><strong>Why AiMY scored this:</strong> ' + escapeHtml(kpi.reason) + '</p><span class="ai-meta">' + icons.spark + (kpi.confidence ? kpi.confidence + '% confident' : 'Evidence unavailable') + '</span></div>' +
          (state.role === 'employee' ? '<div class="ai-reading"><p><strong>Evaluation reason:</strong> ' + escapeHtml(kpi.reason) + '</p></div>' : '') +
        '</div>' +
        (evidence ? '<section class="card-evidence" aria-label="Supporting evidence"><div class="card-evidence-heading">Supporting evidence</div>' + evidence + '</section>' : '') +
        actionMarkup(kpi, decision, dispute) +
        composerMarkup(kpi) +
        disputeMarkup(kpi, dispute);

      els.kpiList.appendChild(card);
    });
    if (!visibleCount) els.kpiList.innerHTML = '<div class="empty-state"><strong>No matching KPIs</strong>Choose another filter to continue reviewing this evaluation.</div>';
    bindKpiEvents();
  }

  function disputeReviewActionsMarkup(kpi, dispute) {
    const hasDispute = dispute && dispute.status === 'open';
    return '<div class="kpi-actions reviewer-only"><div class="manager-actions"><span class="action-label">Dispute review</span>' +
      (hasDispute ? '<span class="verdict-chip pending">Open dispute</span><button class="decision-btn manager-review" type="button" aria-expanded="false">Review dispute</button>' : '<span class="decision-result"><strong>No open dispute</strong></span>') +
      '<span class="decision-result">Final verdict: <strong>' + verdictLabel(finalVerdict(kpi)) + '</strong></span></div></div>';
  }

  function actionMarkup(kpi, decision, dispute) {
    if (state.role === 'auditor') {
      const hasOpenDispute = dispute && dispute.status === 'open';
      if (hasOpenDispute) return disputeReviewActionsMarkup(kpi, dispute);
      return '<div class="kpi-actions auditor-only">' +
        '<span class="action-label">Manual review</span>' +
        decisionButton(kpi, 'agree', decision) + decisionButton(kpi, 'disagree', decision) + decisionButton(kpi, 'na', decision) +
        '<span class="decision-result">' + (decision ? '<strong>Saved by ' + escapeHtml(decision.actor) + '</strong> · ' + escapeHtml(decision.time) : 'Not reviewed') + '</span>' +
      '</div>' + (dispute ? disputeReviewActionsMarkup(kpi, dispute) : '');
    }
    if (state.role === 'employee') {
      const hasDispute = dispute && dispute.status === 'open';
      const resolvedDispute = dispute && dispute.status === 'resolved';
      return '<div class="kpi-actions employee-only"><div class="employee-actions"><span class="action-label">Your action</span>' +
        '<button class="decision-btn dispute-trigger" type="button" aria-expanded="false" ' + (hasDispute ? 'disabled' : '') + '>' + (hasDispute ? 'Dispute open' : resolvedDispute ? 'Raise another dispute' : 'Dispute this KPI') + '</button>' +
        '<span class="decision-result">' + (hasDispute ? '<strong>Awaiting review</strong>' : resolvedDispute ? '<strong>Previous dispute resolved</strong>' : 'Only you and resolving reviewers can see the dispute') + '</span></div></div>';
    }
    return disputeReviewActionsMarkup(kpi, dispute);
  }

  function decisionButton(kpi, type, decision) {
    const label = type === 'agree' ? 'Agree' : type === 'disagree' ? 'Disagree' : 'N/A';
    const selected = decision && decision.type === type ? ' selected ' + type : '';
    const symbol = type === 'agree' ? '✓' : type === 'disagree' ? '×' : '–';
    return '<button class="decision-btn' + selected + '" type="button" data-decision="' + type + '"><span>' + symbol + '</span>' + label + '</button>';
  }

  function composerMarkup(kpi) {
    return '<div class="inline-composer" data-composer>' +
      '<div class="composer-top"><div class="composer-label"><strong data-composer-title>Correct this KPI decision</strong><span class="required">All fields required</span></div>' +
      '<textarea class="comment-box" aria-label="Decision explanation" aria-required="true" placeholder="Describe the evidence and explain why the current result should change."></textarea>' +
      '<div class="decision-fields">' +
        '<label class="field-label">Change result to<select class="select corrected-verdict" aria-label="Change result to" required><option value="">Choose a result</option><option value="pass">Pass</option><option value="fail">Fail</option><option value="na">N/A</option></select></label>' +
        '<label class="field-label">Reason category<select class="select reason-category" aria-label="Decision reason category" required><option value="">Choose a reason</option><option>Evidence contradicts AI verdict</option><option>Criteria ambiguous</option><option>Target mismatch</option><option>Not measurable on this channel</option><option>Not applicable to this queue</option><option>Superseded by another KPI</option><option>Manager dispute resolution</option></select></label>' +
      '</div>' +
      '<div class="field-error" aria-live="polite"></div></div>' +
      '<div class="composer-foot composer-actions-only"><button class="btn composer-cancel" type="button">Cancel</button><button class="btn primary composer-submit" type="button" disabled>Save decision</button></div>' +
    '</div>';
  }

  function disputeMarkup(kpi, dispute) {
    const open = dispute && dispute.status === 'open';
    const employeeBox = '<div class="dispute-box employee-only" data-employee-dispute><strong>Raise a dispute</strong><p>Explain what you believe is wrong. This does not change the score until a reviewer resolves it.</p><textarea class="comment-box dispute-comment" aria-label="Dispute comment" aria-required="true" placeholder="Explain your dispute and point to the evidence."></textarea><div class="field-error"></div><div class="composer-foot" style="margin:8px -10px -10px;padding:8px 10px"><span class="hint">Submitted disputes appear in the dispute review queue.</span><button class="btn dispute-cancel" type="button">Cancel</button><button class="btn primary dispute-submit" type="button" disabled>Submit dispute</button></div></div>';
    const reviewerBox = open ? '<div class="dispute-box reviewer-only" data-manager-dispute><div class="dispute-meta"><span class="verdict-chip pending">Open dispute</span><span>Raised by ' + escapeHtml(dispute.by) + '</span></div><p><strong>Employee statement:</strong> ' + escapeHtml(dispute.text) + '</p><div class="manager-resolution"><button class="btn manager-resolve" data-resolution="uphold" type="button">Uphold result</button><button class="btn success manager-resolve" data-resolution="accept" type="button">Accept dispute</button></div></div>' : '';
    return employeeBox + reviewerBox;
  }


  function staticEvidenceMarkup(id) {
    const d=data();
    const row=id.startsWith('call-') ? (d.transcript||[]).find(r=>r.id===id) : id.startsWith('email-') ? (d.emails||[]).find(r=>r.id===id) : (d.chat||[]).find(r=>r.id===id);
    if(!row) return '';
    const label=row.speaker||row.from||'Source';
    const stamp=row.time||row.sent||'';
    const text=row.text||(row.body||[]).join('\n\n');
    const privateNote=row.visibility==='private'||row.kind==='private';
    return '<figure class="evidence-excerpt"><figcaption><strong>'+escapeHtml(label)+'</strong><span>'+escapeHtml(stamp)+(privateNote?' · Private team note':'')+'</span></figcaption><blockquote>'+escapeHtml(text)+'</blockquote></figure>';
  }

  function evidenceLabel(id, index) {
    if (id.startsWith('call-')) {
      const row = data().transcript.find(x => x.id === id);
      return row ? row.time : 'Transcript ' + (index + 1);
    }
    if (id.startsWith('email-')) return 'Message ' + id.split('-')[1];
    if (id.startsWith('chat-')) return 'Chat ' + id.split('-')[1];
    return 'Evidence ' + (index + 1);
  }

  function isEvidenceVisible(id) {
    if (state.role !== 'employee') return true;
    if (id.startsWith('email-')) {
      const item = data().emails && data().emails.find(row => row.id === id);
      return !item || item.visibility !== 'private';
    }
    if (id.startsWith('chat-')) {
      const item = data().chat && data().chat.find(row => row.id === id);
      return !item || item.kind !== 'private';
    }
    return true;
  }

  function bindKpiEvents() {
    els.kpiList.querySelectorAll('[data-card-toggle]').forEach(btn => btn.addEventListener('click', () => {
      const card = btn.closest('.kpi-card');
      const id = card.dataset.kpiId;
      const willExpand = card.classList.contains('is-collapsed');
      if (willExpand) { state.expandedKpis.add(id); state.collapsedKpis.delete(id); }
      else { state.collapsedKpis.add(id); state.expandedKpis.delete(id); }
      card.classList.toggle('is-collapsed', !willExpand);
      btn.setAttribute('aria-expanded', String(willExpand));
      btn.textContent = willExpand ? 'Hide details' : 'Show details';
    }));
    els.kpiList.querySelectorAll('[data-decision]').forEach(btn => {
      btn.addEventListener('click', () => {
        const card = btn.closest('.kpi-card');
        const kpi = data().kpis.find(k => k.id === card.dataset.kpiId);
        const type = btn.dataset.decision;
        if (type === 'agree') saveSimpleDecision(kpi);
        else openComposer(card, kpi, type);
      });
    });
    els.kpiList.querySelectorAll('.inline-composer .comment-box').forEach(box => {
      box.addEventListener('input', () => updateComposer(box.closest('[data-composer]')));
    });
    els.kpiList.querySelectorAll('.corrected-verdict, .reason-category').forEach(control => control.addEventListener('change', () => updateComposer(control.closest('[data-composer]'))));
    els.kpiList.querySelectorAll('.composer-cancel').forEach(btn => btn.addEventListener('click', () => closeComposer(btn.closest('.kpi-card'))));
    els.kpiList.querySelectorAll('.composer-submit').forEach(btn => btn.addEventListener('click', () => submitManualDecision(btn.closest('.kpi-card'))));
    els.kpiList.querySelectorAll('.dispute-trigger').forEach(btn => btn.addEventListener('click', () => {
      const box = btn.closest('.kpi-card').querySelector('[data-employee-dispute]');
      if (box) { box.classList.add('open'); btn.setAttribute('aria-expanded','true'); box.querySelector('textarea').focus(); }
    }));
    els.kpiList.querySelectorAll('.dispute-cancel').forEach(btn => btn.addEventListener('click', () => {
      const card = btn.closest('.kpi-card');
      btn.closest('.dispute-box').classList.remove('open');
      const trigger = card.querySelector('.dispute-trigger');
      if (trigger) { trigger.setAttribute('aria-expanded','false'); trigger.focus(); }
    }));
    els.kpiList.querySelectorAll('.dispute-comment').forEach(box => box.addEventListener('input', () => {
      const submit = box.closest('.dispute-box').querySelector('.dispute-submit');
      submit.disabled = box.value.trim().length < 8;
    }));
    els.kpiList.querySelectorAll('.dispute-submit').forEach(btn => btn.addEventListener('click', () => submitEmployeeDispute(btn.closest('.kpi-card'))));
    els.kpiList.querySelectorAll('.manager-review').forEach(btn => btn.addEventListener('click', () => {
      const box = btn.closest('.kpi-card').querySelector('[data-manager-dispute]');
      if (box) { box.classList.toggle('open'); btn.setAttribute('aria-expanded', String(box.classList.contains('open'))); }
    }));
    els.kpiList.querySelectorAll('.manager-resolve').forEach(btn => btn.addEventListener('click', () => confirmDisputeResolution(btn.closest('.kpi-card'), btn.dataset.resolution)));
  }

  function openComposer(card, kpi, mode) {
    document.querySelectorAll('.inline-composer.open').forEach(c => c.classList.remove('open'));
    document.querySelectorAll('.kpi-card.is-active').forEach(c => c.classList.remove('is-active'));
    state.expandedKpis.add(kpi.id);
    state.collapsedKpis.delete(kpi.id);
    card.classList.remove('is-collapsed');
    card.classList.add('is-active');
    const composer = card.querySelector('[data-composer]');
    composer.dataset.mode = mode;
    composer.classList.add('open');
    const box = composer.querySelector('.comment-box');
    const verdict = composer.querySelector('.corrected-verdict');
    const category = composer.querySelector('.reason-category');
    composer.querySelector('[data-composer-title]').textContent = mode === 'na' ? 'Mark this KPI not applicable' : 'Correct this KPI decision';
    composer.querySelector('.composer-submit').textContent = mode === 'na' ? 'Save N/A decision' : 'Save corrected decision';
    verdict.disabled = mode === 'na';
    verdict.value = mode === 'na' ? 'na' : '';
    category.value = '';
    box.value = '';
    box.focus();
    const existing = decisionFor(kpi);
    if (existing && ((mode === 'disagree' && existing.type === 'disagree') || (mode === 'na' && existing.type === 'na'))) {
      box.value = existing.comment;
      verdict.value = existing.corrected;
      category.value = existing.category || '';
    }
    updateComposer(composer);
  }

  function closeComposer(card) {
    card.classList.remove('is-active');
    const composer = card.querySelector('[data-composer]');
    composer.classList.remove('open');
    composer.querySelector('.field-error').textContent = '';
    const trigger = card.querySelector('[data-decision="' + composer.dataset.mode + '"]');
    if (trigger) trigger.focus();
  }

  function updateComposer(composer) {
    const box = composer.querySelector('.comment-box');
    const verdict = composer.querySelector('.corrected-verdict');
    const category = composer.querySelector('.reason-category');
    const submit = composer.querySelector('.composer-submit');
    const value = box.value.trim();
    submit.disabled = value.length < 8 || !verdict.value || !category.value;
    composer.querySelector('.field-error').textContent = '';
  }

  function captureAction(label) {
    state.lastAction = {
      label,
      decisions: JSON.parse(JSON.stringify(state.decisions)),
      disputes: JSON.parse(JSON.stringify(state.disputes)),
      completed: JSON.parse(JSON.stringify(state.completed)),
      logs: Object.fromEntries(Object.entries(datasets).map(([key,value]) => [key, JSON.parse(JSON.stringify(value.logs))]))
    };
  }

  function saveSimpleDecision(kpi) {
    const key = decisionKey(kpi.id);
    captureAction('Agree with ' + kpi.title);
    state.decisions[key] = {type:'agree', corrected:kpi.verdict, comment:'', actor:'Nour Wael', time:'Just now'};
    addLog('manual', 'Just now', 'Nour Wael', kpi.title + ': QA result Agree.');
    renderAll(false);
    showToast('KPI agreed', kpi.title + ' was saved and the score was recalculated.', true);
  }

  function submitManualDecision(card) {
    const kpi = data().kpis.find(k => k.id === card.dataset.kpiId);
    const composer = card.querySelector('[data-composer]');
    const box = composer.querySelector('.comment-box');
    const comment = box.value.trim();
    const corrected = composer.querySelector('.corrected-verdict').value;
    const category = composer.querySelector('.reason-category').value;
    if (comment.length < 8 || !corrected || !category) {
      composer.querySelector('.field-error').textContent = 'Enter an explanation, new result and reason category before saving.';
      (comment.length < 8 ? box : !corrected ? composer.querySelector('.corrected-verdict') : composer.querySelector('.reason-category')).focus();
      return;
    }
    const key = decisionKey(kpi.id);
    const before = scoreMetaFor(data());
    captureAction('Change ' + kpi.title + ' to ' + verdictLabel(corrected));
    const type = corrected === 'na' ? 'na' : 'disagree';
    state.decisions[key] = {type, corrected, comment, category, actor:'Nour Wael', time:'Just now'};
    const after = scoreMetaFor(data());
    addLog('manual', 'Just now', 'Nour Wael', kpi.title + ': QA result corrected to ' + verdictLabel(corrected) + '. Reason: ' + category + '. Comment: ' + comment);
    renderAll(false);
    showToast('Decision saved', kpi.title + ' is now ' + verdictLabel(corrected) + '. Score ' + before.score + '% → ' + after.score + '%.', true);
  }

  function submitEmployeeDispute(card) {
    const kpi = data().kpis.find(k => k.id === card.dataset.kpiId);
    const box = card.querySelector('.dispute-comment');
    const text = box.value.trim();
    if (text.length < 8) return;
    const key = decisionKey(kpi.id);
    captureAction('Submit dispute for ' + kpi.title);
    state.disputes[key] = {status:'open', by:data().agent, text};
    addLog('manual', 'Just now', data().agent, 'Employee dispute raised for ' + kpi.title + ': ' + text);
    renderAll(false);
    showToast('Dispute submitted', 'It is now visible in the dispute review queue for Quality Auditors and Managers.', true);
  }

  function confirmDisputeResolution(card, resolution) {
    const kpi = data().kpis.find(k => k.id === card.dataset.kpiId);
    const current = finalVerdict(kpi);
    const corrected = current === 'pass' ? 'fail' : 'pass';
    openConfirm({
      title: resolution === 'accept' ? 'Accept this dispute?' : 'Uphold the current result?',
      text: resolution === 'accept' ? 'Accepting the employee dispute will record a reviewer correction and recalculate the score.' : 'Upholding will close the dispute without changing the current verdict.',
      detail: resolution === 'accept' ? verdictLabel(current) + ' → ' + verdictLabel(corrected) + ' for ' + kpi.title : kpi.title + ' remains ' + verdictLabel(current),
      confirmLabel: resolution === 'accept' ? 'Accept and correct' : 'Uphold result',
      onConfirm: () => resolveDispute(card, resolution)
    });
  }

  function resolveDispute(card, resolution) {
    const kpi = data().kpis.find(k => k.id === card.dataset.kpiId);
    const key = decisionKey(kpi.id);
    const existing = disputeFor(kpi);
    const reviewer = state.role === 'manager' ? 'Team Manager' : 'Nour Wael';
    const reviewerRole = state.role === 'manager' ? 'Manager' : 'Quality Auditor';
    captureAction((resolution === 'accept' ? 'Accept' : 'Uphold') + ' dispute for ' + kpi.title);
    state.disputes[key] = {...existing, status:'resolved', resolution, resolvedBy:reviewer, resolvedByRole:reviewerRole};
    if (resolution === 'accept') {
      const current = finalVerdict(kpi);
      state.decisions[key] = {type:'disagree', corrected: current === 'pass' ? 'fail' : 'pass', comment:reviewerRole + ' accepted employee dispute.', category:'Manager dispute resolution', actor:reviewer, time:'Just now'};
    }
    addLog('manual', 'Just now', reviewer, kpi.title + ': employee dispute ' + (resolution === 'accept' ? 'accepted' : 'upheld existing result') + ' by ' + reviewerRole + '.');
    renderAll(false);
    showToast('Dispute resolved', kpi.title + ' was resolved and the final score was recalculated.', true);
  }

  function isDetectedSpeakerCluster(label) {
    return /^Speaker\s+\d+$/i.test(label || '');
  }

  function detectedSpeakerClusterFor(row, d) {
    if (!row || !row.detectedSpeakerId) return [];
    return d.transcript.filter(item => item.detectedSpeakerId === row.detectedSpeakerId);
  }

  function speakerAssignmentMarkup(row, d) {
    const assignment = row.manualAssignment || null;
    const sourceSpeaker = row.sourceSpeaker || row.speaker;
    const clusterScope = detectedSpeakerClusterFor(row, d).length > 1 || isDetectedSpeakerCluster(sourceSpeaker);
    const selected = assignment ? assignment.type : '';
    const selectedScope = assignment ? assignment.scope : '';
    const otherName = assignment && assignment.type === 'other' ? assignment.otherName || row.speaker : '';
    const customerLabel = d.customer && !/^unknown/i.test(d.customer) ? 'Customer · ' + d.customer : 'Customer';
    return '<div class="speaker-assignment speaker-editor" data-speaker-assignment>' +
      '<div class="speaker-assignment-grid">' +
        '<select class="select speaker-assignment-select" aria-label="Assign speaker">' +
          '<option value="" disabled hidden ' + (!selected ? 'selected' : '') + '>Assign speaker</option>' +
          '<option value="agent" ' + (selected === 'agent' ? 'selected' : '') + '>Agent · ' + escapeHtml(d.agent) + '</option>' +
          '<option value="customer" ' + (selected === 'customer' ? 'selected' : '') + '>' + escapeHtml(customerLabel) + '</option>' +
          '<option value="other" ' + (selected === 'other' ? 'selected' : '') + '>Other speaker</option>' +
          '<option value="unknown" ' + (selected === 'unknown' ? 'selected' : '') + '>Keep as unknown</option>' +
        '</select>' +
        (clusterScope
          ? '<select class="select speaker-scope-select" aria-label="Apply speaker assignment to"><option value="" disabled hidden ' + (!selectedScope ? 'selected' : '') + '>Apply to</option><option value="speaker" ' + (selectedScope === 'speaker' ? 'selected' : '') + '>All segments from this detected speaker</option><option value="segment" ' + (selectedScope === 'segment' ? 'selected' : '') + '>This segment only</option></select>'
          : '<select class="select speaker-scope-select" aria-label="Apply speaker assignment to" disabled><option selected value="segment">This segment only</option></select>') +
      '</div>' +
      '<label class="field-label speaker-other-field" ' + (selected === 'other' ? '' : 'hidden') + '>Other speaker name<input class="speaker-name-input" type="text" maxlength="60" value="' + escapeHtml(otherName) + '" placeholder="Enter speaker name or role"></label>' +
      '<div class="speaker-assignment-actions"><button class="btn speaker-assignment-cancel" type="button">Cancel</button><button class="btn primary speaker-assignment-save" type="button" disabled>Save assignment</button></div>' +
    '</div>';
  }

  function renderTranscript(d) {
    return '<div class="transcript">' + d.transcript.map(row => {
      const assignment = row.manualAssignment || null;
      let secondary = '';
      if (assignment) {
        const assignmentState = assignment.inherited ? 'assigned from earlier segment' : 'manually assigned';
        secondary = assignment.type === 'unknown'
          ? '<span class="speaker-meta speaker-manual-note">Reviewed · ' + row.confidence + '% attribution</span>'
          : '<span class="speaker-meta speaker-manual-note">' + (assignment.detail ? escapeHtml(assignment.detail) + ' · ' : '') + assignmentState + '</span>';
      } else if (row.kind === 'unknown') {
        secondary = '<span class="speaker-meta">' + row.confidence + '% attribution</span>';
      }
      const editable = state.role !== 'employee' && (row.kind === 'unknown' || assignment);
      const editButton = editable && assignment
        ? '<button class="speaker-edit speaker-editor" type="button" aria-expanded="false" aria-label="Change speaker assignment" title="Change assignment"><svg class="icon icon-sm"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"></path></svg></button>'
        : '';
      const assignButton = row.kind==='unknown' ? '<aside class="speaker-insight"><div class="speaker-insight-title">'+icons.spark+' AiMY insight <span>Needs review</span></div><strong>Speaker not identified</strong><p>AiMY could not reliably identify '+escapeHtml(row.sourceSpeaker||row.speaker)+'. '+(state.role==='employee'?'An auditor needs to identify this speaker manually.':'Identify this speaker manually to clarify the transcript.')+'</p>'+(editable?'<button class="speaker-fix speaker-editor" type="button" aria-expanded="false">Identify speaker manually</button>':'')+'</aside>' : '';

      return '<div class="' + rowClass + '" id="' + row.id + '" data-transcript-row="' + row.id + '">' +
        '<button class="ts-btn" type="button" data-seek="' + row.sec + '" aria-label="Seek recording to ' + row.time + '">' + row.time + '</button>' +
        '<div class="' + speakerClass + '"><span class="speaker-dot">' + initial + '</span><div class="speaker-copy"><div class="speaker-primary"><span class="speaker-name">' + escapeHtml(row.speaker) + '</span>' + editButton + '</div>' + secondary + '</div></div>' +

  function updateSpeakerAssignmentForm(form) {
    const speakerSelect = form.querySelector('.speaker-assignment-select');
    const otherField = form.querySelector('.speaker-other-field');
    const otherInput = form.querySelector('.speaker-name-input');
    const scopeSelect = form.querySelector('.speaker-scope-select');
    const save = form.querySelector('.speaker-assignment-save');
    const isOther = speakerSelect.value === 'other';
    otherField.hidden = !isOther;
    save.disabled = !speakerSelect.value || !scopeSelect.value || (isOther && otherInput.value.trim().length < 2);
  }

  function closeSpeakerAssignment(rowEl, returnFocus = true) {
    rowEl.classList.remove('assignment-open');
    const trigger = rowEl.querySelector('.speaker-fix, .speaker-edit');
    if (trigger) {
      trigger.setAttribute('aria-expanded', 'false');
      if (returnFocus) trigger.focus();
    }
  }

  function saveSpeakerAssignment(rowEl) {
    const d = data();
    const row = d.transcript.find(item => item.id === rowEl.dataset.transcriptRow);
    const form = rowEl.querySelector('[data-speaker-assignment]');
    if (!row || !form) return;
    const type = form.querySelector('.speaker-assignment-select').value;
    const scopeSelect = form.querySelector('.speaker-scope-select');
    const scope = scopeSelect ? scopeSelect.value : 'segment';
    const otherName = form.querySelector('.speaker-name-input').value.trim();
    if (!type || (type === 'other' && otherName.length < 2)) return;

    const sourceSpeaker = row.sourceSpeaker || row.speaker;
    const linkedDetectedSegments = detectedSpeakerClusterFor(row, d);
    const targets = scope === 'speaker'
      ? (linkedDetectedSegments.length > 1
          ? linkedDetectedSegments
          : isDetectedSpeakerCluster(sourceSpeaker)
            ? d.transcript.filter(item => (item.sourceSpeaker || item.speaker) === sourceSpeaker)
            : [row])
      : [row];
    const actor = document.querySelector('.user-copy strong')?.textContent || (state.role === 'manager' ? 'Manager' : 'Quality Auditor');
    let newSpeaker = sourceSpeaker;
    let newKind = 'unknown';
    let detail = '';
    if (type === 'agent') { newSpeaker = 'Agent'; newKind = 'agent'; detail = d.agent; }
    else if (type === 'customer') { newSpeaker = 'Customer'; newKind = 'customer'; detail = d.customer && !/^unknown/i.test(d.customer) ? d.customer : ''; }
    else if (type === 'other') { newSpeaker = otherName; newKind = 'other'; detail = 'Other speaker'; }

    targets.forEach(target => {
      if (!target.sourceSpeaker) target.sourceSpeaker = target.speaker;
      target.speaker = type === 'unknown' ? target.sourceSpeaker : newSpeaker;
      target.kind = type === 'unknown' ? 'unknown' : newKind;
      target.manualAssignment = {
        type,
        scope,
        otherName: type === 'other' ? otherName : '',
        detail,
        actor,
        time:'Just now',
        inherited: scope === 'speaker' && target.id !== row.id,
        assignmentSourceId: row.id
      };
    });

    const scopeCopy = targets.length > 1 ? targets.length + ' matching segments' : 'this segment';
    const resultCopy = type === 'agent' ? 'Agent · ' + d.agent : type === 'customer' ? 'Customer' : type === 'other' ? otherName : 'Kept as unknown';
    addLog('manual', 'Just now', actor, 'Speaker attribution: ' + sourceSpeaker + ' → ' + resultCopy + ' (' + scopeCopy + '). Saved KPI decisions were not changed automatically.');
    renderInteraction();
    renderKpis();
    renderActivity();
    showToast('Speaker assignment saved', resultCopy + ' applied to ' + scopeCopy + ' and recorded in the Manual audit log.');
    const updatedRow = document.getElementById(row.id);
    const updatedTrigger = updatedRow && updatedRow.querySelector('.speaker-fix, .speaker-edit');
    if (updatedTrigger) updatedTrigger.focus();
  }


  function bindInteractionEvents() {
    const range=document.getElementById('audioRange');
    if(range)range.addEventListener('input',()=>seekAudio(Number(range.value)));
    const play=document.getElementById('playBtn');
    if(play)play.addEventListener('click',togglePlay);
    document.querySelectorAll('[data-seek]').forEach(btn => btn.addEventListener('click', () => seekAudio(Number(btn.dataset.seek))));

    document.querySelectorAll('.speaker-fix, .speaker-edit').forEach(btn => btn.addEventListener('click', () => {
      const rowEl = btn.closest('[data-transcript-row]');
      const opening = !rowEl.classList.contains('assignment-open');
      document.querySelectorAll('.transcript-row.assignment-open').forEach(other => { if (other !== rowEl) closeSpeakerAssignment(other, false); });
      rowEl.classList.toggle('assignment-open', opening);
      btn.setAttribute('aria-expanded', String(opening));
      if (opening) {
        const form = rowEl.querySelector('[data-speaker-assignment]');
        updateSpeakerAssignmentForm(form);
        form.querySelector('.speaker-assignment-select').focus();
      }
    }));

    document.querySelectorAll('[data-speaker-assignment]').forEach(form => {
      const speakerSelect = form.querySelector('.speaker-assignment-select');
      const scopeSelect = form.querySelector('.speaker-scope-select');
      const otherInput = form.querySelector('.speaker-name-input');
      speakerSelect.addEventListener('change', () => { updateSpeakerAssignmentForm(form); if (speakerSelect.value === 'other') otherInput.focus(); });
      scopeSelect.addEventListener('change', () => updateSpeakerAssignmentForm(form));
      otherInput.addEventListener('input', () => updateSpeakerAssignmentForm(form));
      form.querySelector('.speaker-assignment-cancel').addEventListener('click', () => closeSpeakerAssignment(form.closest('[data-transcript-row]')));
      form.querySelector('.speaker-assignment-save').addEventListener('click', () => saveSpeakerAssignment(form.closest('[data-transcript-row]')));
    });

    document.querySelectorAll('.quote-toggle').forEach(btn => btn.addEventListener('click', () => {
      const body = btn.nextElementSibling;
      body.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(body.classList.contains('open')));
      btn.textContent = body.classList.contains('open') ? 'Hide quoted history' : 'Show quoted history';
    }));
  }

  function seekAudio(sec) {
    const range = document.getElementById('audioRange');
    if (range) {
      range.value = sec;
      const progress = Number(range.max) ? (sec / Number(range.max)) * 100 : 0;
      range.parentElement.style.setProperty('--progress', progress + '%');
    }
    const min = Math.floor(sec / 60), s = String(sec % 60).padStart(2,'0');
    const time = document.getElementById('playTime');
    if (time) time.textContent = min + ':' + s;
    if (range) range.setAttribute('aria-valuetext', min + ':' + s + ' of 8:34');
  }

  let playTimer = null;
  function togglePlay() {
    state.playing = !state.playing;
    const icon = document.getElementById('playIcon');
    const play = document.getElementById('playBtn');
    if (icon) icon.innerHTML = state.playing ? icons.pause : icons.play;
    if (play) play.setAttribute('aria-label', state.playing ? 'Pause recording preview' : 'Play recording preview');
    clearInterval(playTimer);
    if (state.playing) {
      playTimer = setInterval(() => {
        const range = document.getElementById('audioRange');
        if (!range) return;
        let next = Number(range.value) + 1;
        if (next > Number(range.max)) { state.playing = false; clearInterval(playTimer); next = 0; if (icon) icon.innerHTML = icons.play; if (play) play.setAttribute('aria-label','Play recording preview'); }
        seekAudio(next);
      }, 1000);
    }
  }

  function undoLast() {
    const action = state.lastAction;
    if (!action) return;
    state.decisions = JSON.parse(JSON.stringify(action.decisions));
    state.disputes = JSON.parse(JSON.stringify(action.disputes));
    state.completed = JSON.parse(JSON.stringify(action.completed));
    Object.entries(action.logs).forEach(([key,logs]) => { datasets[key].logs = JSON.parse(JSON.stringify(logs)); });
    state.lastAction = null;
    renderAll(false);
    showToast('Change undone', action.label + ' was fully restored, including its activity log.');

  els.agreeAllBtn.addEventListener('click', () => {
    const targets = data().kpis.filter(kpi => !decisionFor(kpi) || finalVerdict(kpi) === 'pending');
    if (!targets.length) {
      showToast('All KPIs reviewed', 'There are no remaining KPI decisions. Complete audit is ready.');
      els.completeAuditBtn.focus();
      return;
    }
    const unscored = targets.filter(kpi => finalVerdict(kpi) === 'pending');
    const scored = targets.filter(kpi => finalVerdict(kpi) !== 'pending');
    const weight = targets.reduce((sum,kpi) => sum + kpi.weight, 0);
    const bulkText = unscored.length
      ? 'This reviews every remaining KPI. Scored AiMY readings are recorded as Agree. Unscored KPIs are marked N/A so every KPI has a final review state.'
      : 'This records an explicit agreement for every remaining KPI so the audit can be completed.';
    const detailParts = [targets.length + ' KPI' + (targets.length === 1 ? '' : 's'), weight + ' total points'];
    if (unscored.length) detailParts.push(unscored.length + ' unscored → N/A');
    openConfirm({
      title:'Agree with remaining KPIs?',
      text:bulkText,
      detail:detailParts.join(' · ') + ' · one atomic audit entry',
      confirmLabel:'Review all ' + targets.length + ' remaining',
      onConfirm:() => {
        captureAction('Bulk review for ' + targets.length + ' KPIs');
        scored.forEach(kpi => {
          state.decisions[decisionKey(kpi.id)] = {type:'agree', corrected:kpi.verdict, comment:'', actor:'Nour Wael', time:'Just now'};
        });
        unscored.forEach(kpi => {
          state.decisions[decisionKey(kpi.id)] = {
            type:'na',
            corrected:'na',
            comment:'Bulk review: no AiMY verdict was available, so this KPI was marked N/A.',
            category:'Not measurable on this channel',
            actor:'Nour Wael',
            time:'Just now'
          };
        });
        addLog('manual','Just now','Nour Wael','Bulk review completed for ' + targets.length + ' remaining KPIs: ' + scored.length + ' agreed' + (unscored.length ? ' and ' + unscored.length + ' unscored marked N/A' : '') + '.');
        renderAll(false);
        const completion = completionState();
        if (completion.ready) {
          showToast('All KPIs reviewed', 'Complete audit is now active and ready to submit.', true);
          requestAnimationFrame(() => els.completeAuditBtn.focus());
        } else {
          showToast('Bulk review saved', completion.outstanding.length + ' KPI' + (completion.outstanding.length === 1 ? '' : 's') + ' still require review.', true);
        }
      }
    });
  });

    input.value=''; qaSetOpen(true); qaMessage(query,true);
    const q=query.toLowerCase();
    if (/^(show |view |open )?(all )?(metadata|details|context)$/.test(q)) { openPane('details'); qaMessage('All metadata for '+data().id+' is shown above.'); return; }
    if (/\b(evidence|transcript|recording|conversation|interaction)\b/.test(q) && /\b(show|view|open)\b/.test(q)) { openPane('interaction'); qaMessage('The available interaction evidence is shown above.'); return; }
    if (/\b(insight|insights|unidentified|speaker)\b/.test(q)) { openPane('details'); document.getElementById('qaSpeakerInsights')?.scrollIntoView({block:'start',behavior:'smooth'}); qaMessage('Speaker identification insights are below the metadata.'); return; }
    if (/\b(activity|logs|history)\b/.test(q)) { openPane('activity'); qaMessage('The activity available for this role is shown above.'); return; }
    const stop=new Set(['what','is','the','a','an','for','this','audit','tell','me','about','please','show','who','was','when','and','of','are','my']);
    const terms=q.replace(/[^a-z0-9@. ]/g,' ').split(/\s+/).filter(w=>w&&!stop.has(w));
    const rows=[...els.paneDetails.querySelectorAll('.detail-item')].map(el=>({label:el.querySelector('span').textContent,value:el.querySelector('strong').textContent}));
    els.paneDetails.querySelectorAll('.narrative').forEach(el=>rows.push({label:'Issue and resolution',value:el.textContent}));
    const matches=rows.filter(r=>terms.some(t=>(r.label+' '+r.value).toLowerCase().includes(t)));
    if(matches.length) qaMessage(matches.map(r=>r.label+': '+r.value).join('\n'));
    else qaMessage('I could not match that question to the metadata in this file. Try a field such as agent, customer, score, priority, or timeline. This standalone preview searches the included audit data; it is not connected to an AI service.');
  }
  document.getElementById('qaOpen').addEventListener('click',()=>{openPane('details');qaSetOpen(true,true);});
  document.querySelector('[data-qa-metadata]').addEventListener('click',()=>{openPane('details');qaPanel.querySelector('.support-body').scrollTo({top:0,behavior:'smooth'});});
  ['qaChat','qaFloat'].forEach(id=>document.getElementById(id+'Form').addEventListener('submit',e=>{e.preventDefault();qaSubmit(document.getElementById(id+'Input'));}));
  document.querySelectorAll('[data-qa-pane]').forEach(btn=>btn.addEventListener('click',()=>{openPane(btn.dataset.qaPane);qaPanel.querySelector('.support-body').scrollTo({top:0,behavior:'smooth'});}));
  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&qaOpenState&&!els.confirmDialog.open){e.preventDefault();qaSetOpen(false,true);}});


  // Local shell actions keep the audit intact inside this standalone prototype.
  document.querySelectorAll('[data-shell-target]').forEach(button=>button.addEventListener('click',()=>{
    const target=button.dataset.shellTarget;
    if(target==='Reviews'||target==='QA') { qaSetOpen(false); document.getElementById('qaSidebar').classList.remove('shell-open'); document.getElementById('qaNavToggle').setAttribute('aria-expanded','false'); }
    else showToast(target, target+' is outside this audit prototype. Your current audit is preserved.');
  }));
  document.getElementById('qaUserMenu').addEventListener('click',()=>showToast('Nour Wael','Product Design · QA prototype'));
  document.getElementById('ntfBell').addEventListener('click',()=>{openPane('activity');document.getElementById('ntfDot').hidden=true;});
  document.querySelectorAll('.nav-role-switch button').forEach(button=>button.addEventListener('click',()=>showToast(button.textContent+' dashboard', 'Dashboard role switching is outside this audit prototype. Use View as to change the audit role.')));
  const shellToggle=document.getElementById('qaNavToggle'), shellSidebar=document.getElementById('qaSidebar');
  shellToggle.addEventListener('click',()=>{const open=shellSidebar.classList.toggle('shell-open');shellToggle.setAttribute('aria-expanded',String(open));shellToggle.setAttribute('aria-label',open?'Close navigation':'Open navigation');});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&shellSidebar.classList.contains('shell-open')){shellSidebar.classList.remove('shell-open');shellToggle.setAttribute('aria-expanded','false');shellToggle.focus();}});
  // Follow the actual wrapped audit header height at each viewport width.
  const shellHeaderObserver=new ResizeObserver(()=>{
    const h=document.querySelector('.page-head').getBoundingClientRect().height;
    qaPanel.style.top='calc(var(--qa-shell-top) + '+h+'px)';
  });
  shellHeaderObserver.observe(document.querySelector('.page-head'));

  document.getElementById('fullSourceBtn').addEventListener('click',()=>{ openPane('interaction');qaPanel.querySelector('.support-body').scrollTo({top:0,behavior:'smooth'});qaPanel.querySelector('.support-body').focus({preventScroll:true}); });
  qaPanel.querySelector('.support-body').setAttribute('tabindex','-1');
  bindPaneTabs();
  renderAll(true);
  requestAnimationFrame(() => qaSetOpen(true));
</script>
</body>
</html>
