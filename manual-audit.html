<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AiMY QA · KPI Audit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    try {
      const saved = localStorage.getItem('aimy-ds-theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      if (new URLSearchParams(location.search).get('embed') === '1') document.documentElement.classList.add('is-embedded');
    } catch (error) {}
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }

    :root {
      color-scheme: dark;
      --ai: linear-gradient(104deg, #0066ff 0%, #61adf1 47%, #6fdfe2 100%);
      --d950: #080b10;
      --d900: #0d1117;
      --d875: #111720;
      --d850: #141b24;
      --d825: #18212c;
      --d800: #1c2630;
      --d750: #233040;
      --d700: #2e3d50;
      --d600: #4a5b6e;
      --d500: #637280;
      --d400: #8b9aaa;
      --d300: #b0bcca;
      --d200: #c8d2dc;
      --d100: #d8e0e8;
      --d50: #eef2f6;
      --brand: #3369ff;
      --brand-rgb: 51, 105, 255;
      --brand-dim: rgba(51, 105, 255, .15);
      --brand-glow: rgba(51, 105, 255, .25);
      --qa-accent: #8b4ff4;
      --qa-accent-rgb: 139, 79, 244;
      --qa-accent-dim: rgba(139, 79, 244, .15);
      --qa-text: #a878ff;
      --accent: var(--qa-accent);
      --accent-rgb: var(--qa-accent-rgb);
      --accent-dim: var(--qa-accent-dim);
      --accent-glow: rgba(var(--qa-accent-rgb), .25);
      --teal: #6fdfe2;
      --teal-dim: rgba(111, 223, 226, .12);
      --ai-text: #61adf1;
      --ok: #17b26a;
      --warn: #f79009;
      --err: #f04438;
      --info: #0ea5e9;
      --ok-bg: rgba(23, 178, 106, .12);
      --warn-bg: rgba(247, 144, 9, .12);
      --err-bg: rgba(240, 68, 56, .12);
      --info-bg: rgba(14, 165, 233, .12);
      --body-bg: #171a1c;
      --card-bg: #141b24;
      --card-bg-raised: #1c2630;
      --card-border: rgba(255,255,255,.07);
      --card-border-hover: rgba(255,255,255,.14);
      --card-border-focus: rgba(51,105,255,.4);
      --panel-bg: rgba(13,17,22,.95);
      --glass-bg: rgba(20,27,36,.85);
      --glass-border: rgba(255,255,255,.08);
      --panel: var(--panel-bg);
      --card: var(--card-bg);
      --card-raised: var(--card-bg-raised);
      --wash-1: rgba(255,255,255,.02);
      --wash-2: rgba(255,255,255,.03);
      --wash-3: rgba(255,255,255,.04);
      --wash-4: rgba(255,255,255,.05);
      --wash-5: rgba(255,255,255,.06);
      --wash-6: rgba(255,255,255,.07);
      --wash-7: rgba(255,255,255,.08);
      --wash-8: rgba(255,255,255,.10);
      --wash-9: rgba(255,255,255,.12);
      --wash-10: rgba(255,255,255,.15);
      --hairline: var(--card-border);
      --hairline-strong: var(--card-border-hover);
      --wash: var(--wash-3);
      --wash-strong: var(--wash-7);
      --text: var(--d50);
      --muted: var(--d400);
      --text-strong: #ffffff;
      --link: #6699ff;
      --grad-avatar: linear-gradient(135deg, #7c3aed, #3369ff);
      --grad-ellipse-1: radial-gradient(ellipse at 30% 50%, rgba(0,102,255,.18) 0%, rgba(97,173,241,.10) 28%, transparent 60%);
      --grad-ellipse-2: radial-gradient(ellipse at 75% 70%, rgba(111,223,226,.10) 0%, rgba(139,79,244,.07) 38%, transparent 60%);
      --shadow-sm: 0 1px 3px rgba(0,0,0,.30);
      --shadow-md: 0 4px 16px rgba(0,0,0,.35);
      --shadow-lg: 0 8px 32px rgba(0,0,0,.40);
      --shadow-xl: 0 16px 48px rgba(0,0,0,.50);
      --shadow: var(--shadow-md);
      --topbar: 60px;
      --rail: 72px;
      --r-xs: 4px;
      --r-sm: 6px;
      --r-md: 8px;
      --r-lg: 10px;
      --r-xl: 12px;
      --r-2xl: 16px;
      --r-pill: 9999px;
      --radius-sm: var(--r-sm);
      --radius: var(--r-xl);
      --radius-lg: 14px;
      --font-sans: "Urbanist", system-ui, sans-serif;
      --font-display: "Poppins", "Urbanist", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --t-fast: 150ms;
      --t-base: 200ms;
      --ease-out: cubic-bezier(.22,1,.36,1);
      --transition: var(--t-base) var(--ease-out);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --d950: #f7fafc;
      --d900: #eef2f6;
      --d875: #e9eef4;
      --d850: #e4eaf0;
      --d825: #dde5ec;
      --d800: #d8e0e8;
      --d750: #c8d2dc;
      --d700: #b0bcca;
      --d600: #6e7d8d;
      --d500: #637280;
      --d400: #566472;
      --d300: #3a4653;
      --d200: #2a3540;
      --d100: #1c2630;
      --d50: #10151b;
      --brand-dim: rgba(51,105,255,.12);
      --brand-glow: rgba(51,105,255,.20);
      --qa-accent-dim: rgba(139,79,244,.12);
      --accent-dim: var(--qa-accent-dim);
      --accent-glow: rgba(var(--qa-accent-rgb),.20);
      --qa-text: #7441d4;
      --teal: #0d8f95;
      --teal-dim: rgba(111,223,226,.20);
      --ai-text: #1f5fd0;
      --ok: #0e9257;
      --warn: #b26205;
      --err: #d92d20;
      --info: #067dc2;
      --ok-bg: rgba(23,178,106,.14);
      --warn-bg: rgba(247,144,9,.14);
      --err-bg: rgba(240,68,56,.14);
      --info-bg: rgba(14,165,233,.14);
      --body-bg: #f4f6f9;
      --card-bg: #ffffff;
      --card-bg-raised: #f7f9fc;
      --card-border: rgba(16,24,40,.10);
      --card-border-hover: rgba(16,24,40,.18);
      --panel-bg: rgba(255,255,255,.96);
      --glass-bg: rgba(255,255,255,.85);
      --glass-border: rgba(16,24,40,.10);
      --panel: var(--panel-bg);
      --card: var(--card-bg);
      --card-raised: var(--card-bg-raised);
      --wash-1: rgba(16,24,40,.03);
      --wash-2: rgba(16,24,40,.04);
      --wash-3: rgba(16,24,40,.05);
      --wash-4: rgba(16,24,40,.065);
      --wash-5: rgba(16,24,40,.075);
      --wash-6: rgba(16,24,40,.09);
      --wash-7: rgba(16,24,40,.10);
      --wash-8: rgba(16,24,40,.13);
      --wash-9: rgba(16,24,40,.15);
      --wash-10: rgba(16,24,40,.19);
      --hairline: rgba(16,24,40,.09);
      --hairline-strong: var(--card-border-hover);
      --wash: var(--wash-3);
      --wash-strong: var(--wash-7);
      --text: var(--d50);
      --muted: var(--d400);
      --text-strong: #10151b;
      --link: #245fc9;
      --grad-ellipse-1: radial-gradient(ellipse at 30% 50%, rgba(0,102,255,.07) 0%, rgba(97,173,241,.04) 28%, transparent 60%);
      --grad-ellipse-2: radial-gradient(ellipse at 75% 70%, rgba(111,223,226,.05) 0%, rgba(139,79,244,.035) 38%, transparent 60%);
      --shadow-sm: 0 1px 3px rgba(16,24,40,.08);
      --shadow-md: 0 4px 16px rgba(16,24,40,.10);
      --shadow-lg: 0 8px 32px rgba(16,24,40,.12);
      --shadow-xl: 0 16px 48px rgba(16,24,40,.16);
      --shadow: var(--shadow-md);
    }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: var(--font-sans);
      color: var(--text);
      background: var(--grad-ellipse-1), var(--grad-ellipse-2), var(--body-bg);
      background-attachment: fixed;
    }
    :root[data-theme="light"] body { background: var(--body-bg); }

    * { scrollbar-width: thin; scrollbar-color: var(--wash-8) transparent; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--wash-8); border-radius: var(--r-xs); }
    ::-webkit-scrollbar-thumb:hover { background: var(--wash-10); }
    ::selection { color: var(--text-strong); background: rgba(var(--qa-accent-rgb),.34); }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0,0,0,0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    :focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    .icon { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .icon-sm { width: 14px; height: 14px; }
    .logo-mark { width: 34px; height: 34px; display: block; }

    .topbar {
      height: var(--topbar);
      display: flex;
      align-items: center;
      padding: 0 20px 0 24px;
      border-bottom: 1px solid var(--hairline);
      background: transparent;
      position: relative;
      z-index: 20;
    }

    .brand-lockup { display: flex; align-items: center; gap: 10px; min-width: 220px; }
    .brand-copy { display: flex; align-items: baseline; gap: 7px; }
    .brand-copy strong { font-size: 15px; letter-spacing: -.02em; }
    .brand-copy span { color: var(--qa-accent); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }

    .top-tabs { display: none; }
    .top-tab {
      border: 1px solid transparent;
      background: transparent;
      color: var(--d400);
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .top-tab:hover { background: var(--wash); color: var(--d200); }
    .top-tab.active { color: var(--qa-accent); background: rgba(var(--qa-accent-rgb),.11); border-color: rgba(var(--qa-accent-rgb),.22); }

    .top-actions { min-width: 220px; display: flex; align-items: center; justify-content: flex-end; gap: 9px; }
    .icon-btn {
      width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--wash-7); border-radius: var(--r-md); background: var(--wash-3); color: var(--d400); cursor: pointer;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
    }
    .icon-btn:hover { background: var(--wash-7); border-color: var(--wash-10); color: var(--d100); }
    .user-pill { display: flex; align-items: center; gap: 9px; padding: 4px 10px 4px 4px; border: 1px solid var(--wash-7); border-radius: 20px; background: var(--wash-3); }
    .avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff; background: var(--grad-avatar); }
    .user-copy { display: flex; flex-direction: column; line-height: 1.05; }
    .user-copy strong { font-size: 11px; }
    .user-copy span { font-size: 9px; color: var(--d500); }

    .app { height: calc(100vh - var(--topbar)); display: grid; grid-template-columns: var(--rail) minmax(0,1fr); }
    .rail { padding: 16px 10px; display: flex; flex-direction: column; gap: 6px; background: transparent; }
    .rail-btn {
      width: 50px; min-height: 48px; border-radius: var(--r-md); border: 1px solid transparent; background: transparent; color: var(--d500); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative;
    }
    .rail-btn span { font-size: 8px; font-weight: 700; }
    .rail-btn:hover { color: var(--d200); background: var(--wash-3); border-color: var(--wash-4); }
    .rail-btn.active { color: var(--qa-text); background: var(--qa-accent-dim); border-color: rgba(var(--qa-accent-rgb),.22); box-shadow: 0 0 20px rgba(var(--qa-accent-rgb),.08); }
    .rail-spacer { flex: 1; }

    .main { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
    /* Compact interaction context bar. The KPI workspace begins immediately
       below it, so the audit remains the first dominant surface. */
    .page-head {
      min-height: 52px; padding: 6px 14px; display: flex; align-items: center; gap: 9px; border-bottom: 1px solid var(--hairline);
      background: transparent; flex: 0 0 auto;
    }
    .back-btn {
      width: 30px; height: 30px; flex: 0 0 30px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--d400);
      display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
    }
    .back-btn:hover { color: var(--d100); background: var(--wash); border-color: var(--hairline); }
    .head-copy { min-width: 0; flex: 1 1 auto; display: flex; align-items: center; gap: 8px; overflow: hidden; }
    .head-title { margin: 0; font-size: 17px; letter-spacing: -.022em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .eyebrow { color: var(--qa-accent); font-size: 8px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; white-space: nowrap; }
    .status-chip {
      display: inline-flex; align-items: center; gap: 4px; min-height: 20px; padding: 2px 7px; border-radius: 7px; border: 1px solid var(--hairline); background: var(--wash); color: var(--d300); font-size: 8.5px; font-weight: 700; flex-shrink: 0;
    }
    .status-chip.fail { background: var(--err-bg); color: var(--err); border-color: color-mix(in srgb, var(--err) 26%, transparent); }
    .status-chip.pass { background: var(--ok-bg); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 26%, transparent); }
    .status-chip.pending { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 26%, transparent); }
    .head-controls { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: 0 0 auto; justify-content: flex-end; }
    .control-label { display: flex; align-items: center; gap: 6px; color: var(--d500); font-size: 8px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .select {
      min-height: 30px;
      border: 1px solid var(--card-border);
      border-radius: var(--r-md);
      background-color: var(--card-raised);
      background-image:
        linear-gradient(45deg, transparent 50%, var(--d500) 50%),
        linear-gradient(135deg, var(--d500) 50%, transparent 50%);
      background-position:
        calc(100% - 20px) 50%,
        calc(100% - 16px) 50%;
      background-size: 4px 4px, 4px 4px;
      background-repeat: no-repeat;
      color: var(--d200);
      padding: 0 36px 0 12px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    .btn {
      min-height: 30px; border-radius: var(--r-md); border: 1px solid var(--wash-8); padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; background: var(--wash-4); color: var(--d300); font-size: 10px; font-weight: 800; transition: transform var(--transition), background var(--transition), border-color var(--transition), color var(--transition);
    }
    .btn:hover { background: var(--wash-8); border-color: var(--wash-10); color: var(--d50); }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
    .btn.primary:hover { background: #4d7fff; border-color: #4d7fff; }
    .btn.danger { color: var(--err); background: var(--err-bg); border-color: color-mix(in srgb, var(--err) 26%, transparent); }
    .btn.success { color: var(--ok); background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok) 26%, transparent); }
    .btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }

    .workspace { flex: 1; min-height: 0; padding: 0 20px 20px; display: grid; grid-template-columns: minmax(590px, 1.55fr) minmax(380px, .85fr); gap: 16px; overflow: hidden; position: relative; }
    .workspace.focus-audit { grid-template-columns: minmax(0,1fr) 0; }
    .workspace.focus-audit .support-pane { opacity: 0; pointer-events: none; overflow: hidden; border: 0; }
    .restore-support-btn {
      display: none; position: absolute; top: 10px; right: 28px; z-index: 9;
      box-shadow: 0 8px 24px rgba(0,0,0,.18); backdrop-filter: blur(12px);
    }
    .workspace.focus-audit .restore-support-btn { display: inline-flex; }

    .panel { min-width: 0; min-height: 0; background: var(--panel); border: 1px solid var(--card-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
    .audit-pane { display: flex; flex-direction: column; container-type: inline-size; }
    .audit-scroll { min-height: 0; overflow: auto; padding: 0 14px 14px; scrollbar-gutter: stable; }
    .support-pane { display: flex; flex-direction: column; transition: opacity var(--transition); }

    .audit-summary {
      border: 1px solid var(--card-border); border-radius: 14px; background: var(--card-bg);
      padding: 18px 20px; margin-bottom: 12px;
    }
    .summary-row { display: flex; align-items: center; gap: 20px; }
    .score-block { display: flex; align-items: baseline; gap: 10px; padding-right: 24px; border-right: 1px solid var(--hairline); }
    .score { color: var(--text-strong); font-size: 48px; line-height: .9; font-weight: 800; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
    .score-copy { display: flex; flex-direction: column; gap: 3px; }
    .score-copy strong { color: var(--d50); font-size: 13px; }
    .score-copy span { color: var(--d500); font-size: 12px; }
    .summary-stats { display: flex; align-items: center; gap: 20px; }
    .stat { display: flex; align-items: center; gap: 7px; color: var(--d400); font-size: 12px; white-space: nowrap; }
    .stat strong { color: var(--d50); font-size: 17px; font-variant-numeric: tabular-nums; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--d500); }
    .dot.ok { background: var(--ok); }
    .dot.err { background: var(--err); }
    .dot.warn { background: var(--warn); }
    .summary-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .confidence { min-width: 225px; }
    .confidence-top { display: flex; justify-content: space-between; gap: 8px; color: var(--d500); font-size: 9px; margin-bottom: 6px; }
    .confidence-top strong { color: var(--ok); font-variant-numeric: tabular-nums; }
    .progress { display: block; height: 6px; border-radius: 999px; background: var(--wash-strong); overflow: hidden; }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: var(--ok); }
    .summary-footer { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--hairline); }
    .role-note { min-width: 0; display: flex; align-items: flex-start; gap: 9px; color: var(--d400); font-size: 10.5px; line-height: 1.5; }
    .role-note strong { color: var(--d200); }
    .score-details { margin-left: auto; color: var(--d400); font-size: 12px; }
    .score-details summary { width: max-content; color: var(--link); font-weight: 750; cursor: pointer; }
    .score-details .score-policy { margin-top: 6px; padding: 7px 9px; border-radius: 8px; background: var(--wash); }

    .audit-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; position: sticky; top: -14px; z-index: 6; padding: 10px 0 8px; background: var(--panel); }
    .filter-group { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .filter-btn { border: 1px solid var(--card-border); border-radius: var(--r-pill); padding: 6px 10px; background: var(--card-bg); color: var(--d400); font-size: 10px; font-weight: 750; cursor: pointer; }
    .filter-btn:hover { color: var(--d100); border-color: var(--hairline-strong); }
    .filter-btn.active { color: var(--qa-text); background: var(--qa-accent-dim); border-color: rgba(var(--qa-accent-rgb),.26); }
    .toolbar-spacer { flex: 1; }
    .toolbar-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .compact-select-wrap { display: inline-flex; align-items: center; }
    .compact-select { min-height: 30px; font-size: 10px; }

    .kpi-list { display: flex; flex-direction: column; gap: 9px; }
    .kpi-card { border: 1px solid var(--card-border); border-radius: 14px; background: var(--card-bg); overflow: clip; transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition); }
    .kpi-card:hover { border-color: var(--card-border-hover); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
    .kpi-card.is-active { border-color: rgba(var(--qa-accent-rgb),.42); box-shadow: 0 0 0 2px rgba(var(--qa-accent-rgb),.08); }
    .kpi-card.is-hidden { display: none; }
    .kpi-card.is-reviewed { background: color-mix(in srgb, var(--card-bg) 96%, var(--ok) 4%); }
    .kpi-card-head { padding: 12px 13px 8px; display: flex; align-items: flex-start; gap: 10px; }
    .verdict-symbol { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: 0 0 auto; font-weight: 900; font-size: 14px; margin-top: 1px; }
    .verdict-symbol.pass { color: var(--ok); background: var(--ok-bg); }
    .verdict-symbol.fail { color: var(--err); background: var(--err-bg); }
    .verdict-symbol.pending { color: var(--warn); background: var(--warn-bg); }
    .verdict-symbol.na { color: var(--d400); background: var(--wash-strong); }
    .kpi-heading { min-width: 0; flex: 1; }
    .kpi-title-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .kpi-title { margin: 0; color: var(--d50); font-size: 13px; font-weight: 800; letter-spacing: -.01em; }
    .kpi-code { font-size: 9px; font-weight: 800; letter-spacing: .06em; color: var(--d500); border: 1px solid var(--hairline); padding: 2px 5px; border-radius: 5px; }
    .kpi-question { margin: 3px 0 0; color: var(--d400); font-size: 10.5px; line-height: 1.35; }
    .kpi-head-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .verdict-chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 8px; font-size: 9px; font-weight: 800; border: 1px solid transparent; white-space: nowrap; }
    .verdict-chip.pass { color: var(--ok); background: var(--ok-bg); border-color: color-mix(in srgb,var(--ok) 24%,transparent); }
    .verdict-chip.fail { color: var(--err); background: var(--err-bg); border-color: color-mix(in srgb,var(--err) 24%,transparent); }
    .verdict-chip.pending { color: var(--warn); background: var(--warn-bg); border-color: color-mix(in srgb,var(--warn) 24%,transparent); }
    .verdict-chip.manual { color: var(--qa-accent); background: rgba(var(--qa-accent-rgb),.11); border-color: rgba(var(--qa-accent-rgb),.25); }
    .weight { color: var(--d500); font-size: 9px; font-weight: 700; }

    .kpi-body { padding: 0 13px 11px 51px; }
    .ai-reading { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: start; gap: 10px; padding: 9px 10px; border-radius: var(--r-lg); background: rgba(0,102,255,.07); border: 1px solid rgba(0,102,255,.22); }
    .ai-reading p { margin: 0; color: var(--d300); font-size: 10.5px; line-height: 1.5; }
    .ai-reading p strong { color: var(--d100); }
    .ai-meta { color: var(--ai-text); font-size: 9px; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
    .ai-meta .icon { width: 12px; height: 12px; display: block; }
    .evidence-row { margin-top: 7px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .evidence-label { color: var(--d500); font-size: 9px; font-weight: 700; }
    .evidence-btn { border: 1px solid rgba(var(--brand-rgb),.22); background: var(--brand-dim); color: var(--link); border-radius: var(--r-pill); padding: 4px 7px; font-size: 9px; font-weight: 750; cursor: pointer; }
    .evidence-btn:hover { background: rgba(var(--brand-rgb),.15); }

    .kpi-actions { border-top: 1px solid var(--hairline); display: flex; align-items: center; gap: 7px; padding: 9px 13px 9px 51px; }
    .action-label { color: var(--d500); font-size: 9px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; margin-right: 2px; }
    .decision-btn { min-height: 29px; border: 1px solid var(--card-border); background: transparent; color: var(--d400); border-radius: var(--r-md); padding: 0 10px; font-size: 10px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
    .decision-btn:hover { background: var(--wash); color: var(--d100); }
    .decision-btn.selected.agree { color: var(--ok); background: var(--ok-bg); border-color: color-mix(in srgb,var(--ok) 30%,transparent); }
    .decision-btn.selected.disagree { color: var(--err); background: var(--err-bg); border-color: color-mix(in srgb,var(--err) 30%,transparent); }
    .decision-btn.selected.na { color: var(--d200); background: var(--wash-strong); border-color: var(--hairline-strong); }
    .decision-result { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--d500); font-size: 9px; }
    .decision-result strong { color: var(--d200); }
    .employee-actions, .manager-actions { width: 100%; display: flex; align-items: center; gap: 7px; }

    .inline-composer { display: none; margin: 0 13px 12px 51px; border: 1px solid var(--card-border); border-radius: 11px; background: var(--card-bg-raised); overflow: hidden; }
    .inline-composer.open { display: block; animation: reveal 160ms ease-out both; }
    @keyframes reveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .composer-top { padding: 11px 12px 8px; }
    .composer-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
    .composer-label strong { font-size: 10.5px; }
    .required { color: var(--err); font-size: 9px; font-weight: 800; }
    .comment-box { width: 100%; min-height: 78px; resize: vertical; border-radius: var(--r-md); border: 1px solid var(--card-border-hover); background: var(--card-bg-raised); color: var(--d100); padding: 9px 10px; font-size: 10.5px; line-height: 1.45; }
    .comment-box::placeholder { color: var(--d600); }
    .field-error { min-height: 16px; color: var(--err); font-size: 9px; padding-top: 4px; }
    .ai-interpretation { margin-top: 4px; padding: 9px 10px; background: rgba(0,102,255,.07); border: 1px solid rgba(0,102,255,.22); border-radius: var(--r-md); }
    .ai-interpretation.empty { opacity: .68; }
    .interpretation-head { display: flex; align-items: center; gap: 6px; color: var(--ai-text); font-size: 9px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 7px; }
    .interpretation-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 7px; }
    .interpretation-cell { min-width: 0; }
    .interpretation-cell span { display: block; color: var(--d500); font-size: 8px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
    .interpretation-cell strong { display: block; color: var(--d200); font-size: 9.5px; overflow: hidden; text-overflow: ellipsis; }
    .composer-foot { border-top: 1px solid var(--hairline); padding: 8px 10px; display: flex; align-items: center; gap: 7px; }
    .composer-foot .hint { color: var(--d500); font-size: 12px; line-height: 1.4; margin-right: auto; }
    .composer-foot.composer-actions-only { justify-content: flex-end; }

    .dispute-box { display: none; margin: 0 13px 12px 51px; border: 1px solid rgba(var(--qa-accent-rgb),.25); border-radius: 10px; background: rgba(var(--qa-accent-rgb),.07); padding: 10px; }
    .dispute-box.open { display: block; }
    .dispute-box strong { font-size: 10.5px; }
    .dispute-box p { margin: 5px 0 8px; font-size: 10px; color: var(--d300); line-height: 1.45; }
    .dispute-meta { display: flex; align-items: center; gap: 6px; color: var(--d500); font-size: 9px; }
    .manager-resolution { display: flex; gap: 6px; margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--hairline); }

    .support-head { min-height: 54px; display: flex; align-items: center; gap: 8px; padding: 9px 10px 0; border-bottom: 1px solid var(--hairline); }
    .pane-tabs { display: flex; align-items: center; gap: 3px; align-self: stretch; }
    .pane-tab { border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--d500); padding: 0 10px; font-size: 10px; font-weight: 800; cursor: pointer; }
    .pane-tab:hover { color: var(--d200); }
    .pane-tab.active { color: var(--d50); border-bottom-color: var(--qa-accent); }
    .pane-badge { margin-left: auto; color: var(--d500); font-size: 9px; padding: 4px 7px; border: 1px solid var(--hairline); border-radius: 999px; }
    .support-body { min-height: 0; flex: 1; position: relative; }
    .pane-view { display: none; height: 100%; overflow: auto; padding: 12px; scrollbar-gutter: stable; }
    .pane-view.active { display: block; }

    .interaction-top { padding: 11px; border: 1px solid var(--hairline); border-radius: 11px; background: var(--card); margin-bottom: 10px; }
    .interaction-title-row { display: flex; align-items: flex-start; gap: 9px; }
    .channel-icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--qa-accent); background: rgba(var(--qa-accent-rgb),.11); flex: 0 0 auto; }
    .channel-icon .icon { width: 15px; height: 15px; display: block; }
    .interaction-title { min-width: 0; flex: 1; }
    .interaction-title strong { display: block; font-size: 11.5px; color: var(--d100); }
    .interaction-title span { display: block; margin-top: 2px; color: var(--d500); font-size: 9.5px; }
    .visibility { display: inline-flex; align-items: center; gap: 4px; font-size: 8.5px; font-weight: 800; border-radius: 999px; padding: 3px 6px; border: 1px solid var(--hairline); }
    .visibility.public { color: var(--ok); background: var(--ok-bg); border-color: color-mix(in srgb,var(--ok) 22%,transparent); }
    .visibility.private { color: var(--warn); background: var(--warn-bg); border-color: color-mix(in srgb,var(--warn) 22%,transparent); }
    .visibility .icon { width: 12px; height: 12px; display: block; }

    .audio-player { display: grid; grid-template-columns: auto auto minmax(0,1fr) auto; align-items: center; gap: 8px; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--hairline); }
    .play-btn { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 50%; display: grid; place-items: center; border: 0; background: var(--brand); color: #fff; cursor: pointer; padding: 0; line-height: 0; }
    .play-icon { width: 18px; height: 18px; display: grid; place-items: center; line-height: 0; }
    .play-icon svg { width: 18px; height: 18px; display: block; overflow: visible; }
    .play-icon .play-glyph { transform: translateX(.75px); transform-origin: center; }
    .time-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; color: var(--d300); }
    .timeline-range { width: 100%; accent-color: var(--brand); }
    .duration { color: var(--d500); font-size: 9px; }

    .transcript { display: flex; flex-direction: column; }
    .transcript-row { display: grid; grid-template-columns: 52px 148px minmax(0,1fr); gap: 10px; padding: 11px 5px; border-bottom: 1px solid var(--hairline); border-radius: 8px; transition: background var(--transition), box-shadow var(--transition); }
    .transcript-row:last-child { border-bottom: 0; }
    .transcript-row:hover { background: var(--wash); }
    .transcript-row.evidence-hit, .mail-card.evidence-hit, .chat-line.evidence-hit { background: rgba(var(--brand-rgb),.12); box-shadow: inset 0 0 0 1px rgba(var(--brand-rgb),.35); }
    .ts-btn { border: 0; background: transparent; color: var(--link); font-family: var(--font-mono); font-size: 9px; padding: 2px; cursor: pointer; text-align: left; }
    .speaker { display: flex; align-items: flex-start; gap: 7px; color: var(--d300); font-size: 9.5px; min-width: 0; }
    .speaker-dot { width: 18px; height: 18px; margin-top: 1px; border-radius: 5px; display: grid; place-items: center; font-size: 8px; font-weight: 800; color: #fff; background: var(--d700); flex: 0 0 auto; }
    .speaker.agent .speaker-dot { background: var(--brand); }
    .speaker.customer .speaker-dot { background: var(--qa-accent); }
    .speaker.unknown .speaker-dot { color: var(--warn); background: var(--warn-bg); border: 1px dashed color-mix(in srgb,var(--warn) 45%,transparent); }
    .speaker-copy { min-width: 0; flex: 1; }
    .speaker-primary { min-width: 0; display: flex; align-items: center; gap: 4px; }
    .speaker-name { min-width: 0; color: var(--d200); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .speaker.unknown .speaker-name { color: var(--warn); }
    .speaker-meta { display: block; margin-top: 2px; color: var(--d500); font-size: 10px; font-weight: 600; line-height: 1.25; }
    .speaker-manual-note { color: var(--d500); }
    .utterance { color: var(--d200); font-size: 10.5px; line-height: 1.55; }
    .speaker-fix { margin-top: 4px; border: 0; background: transparent; color: var(--link); font-size: 10px; font-weight: 750; padding: 0; cursor: pointer; }
    .speaker-fix:hover { color: color-mix(in srgb, var(--link) 82%, white); }
    .speaker-edit { width: 22px; height: 22px; flex: 0 0 22px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--d500); padding: 0; cursor: pointer; }
    .speaker-edit:hover { color: var(--d100); background: var(--wash); }
    .speaker-edit .icon { width: 13px; height: 13px; }
    .speaker-manual { color: inherit !important; }
    .speaker.other .speaker-dot { background: var(--d700); }
    .transcript-row.has-manual-assignment { background: transparent; }
    .speaker-assignment { grid-column: 2 / -1; display: none; margin: 2px 0 3px; padding: 12px; border: 1px solid rgba(var(--qa-accent-rgb),.24); border-radius: 10px; background: color-mix(in srgb,var(--card-raised) 96%,var(--qa-accent) 4%); }
    .transcript-row.assignment-open .speaker-assignment { display: block; }
    .speaker-assignment-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
    .speaker-assignment-head strong { color: var(--d100); font-size: 13px; }
    .speaker-assignment-head span { color: var(--d500); font-size: 11px; }
    .speaker-assignment-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 9px; }
    .speaker-other-field { margin-top: 9px; }
    .speaker-name-input { width: 100%; min-height: 40px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--card); color: var(--d200); padding: 0 12px; font-size: 12px; font-weight: 650; }
    .speaker-name-input::placeholder { color: var(--d600); }
    .speaker-assignment-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--hairline); }

    .mail-thread { display: flex; flex-direction: column; gap: 9px; }
    .mail-card { border: 1px solid var(--hairline); border-radius: 11px; background: var(--card); overflow: hidden; transition: background var(--transition), box-shadow var(--transition); }
    .mail-card.private-note { background: color-mix(in srgb,var(--card) 91%,var(--warn) 9%); border-color: color-mix(in srgb,var(--warn) 28%,var(--hairline)); }
    .mail-head { padding: 9px 10px; border-bottom: 1px solid var(--hairline); display: grid; grid-template-columns: 34px minmax(0,1fr) auto; align-items: start; gap: 8px; }
    .sender-avatar { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 50%; background: var(--brand-dim); color: var(--link); font-size: 9px; font-weight: 800; }
    .mail-from { min-width: 0; }
    .mail-from strong { display: block; font-size: 10.5px; color: var(--d100); }
    .mail-from span { display: block; font-size: 8.8px; color: var(--d500); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mail-date { color: var(--d500); font-size: 8.5px; text-align: right; }
    .mail-meta { padding: 7px 10px; border-bottom: 1px solid var(--hairline); display: grid; grid-template-columns: 46px minmax(0,1fr); row-gap: 3px; font-size: 8.8px; }
    .mail-meta span:nth-child(odd) { color: var(--d500); font-weight: 700; }
    .mail-meta span:nth-child(even) { color: var(--d300); overflow-wrap: anywhere; }
    .mail-body { padding: 11px 12px 13px; color: var(--d200); font-size: 10.5px; line-height: 1.6; }
    .mail-body p { margin: 0 0 9px; }
    .mail-body p:last-child { margin-bottom: 0; }
    .signature { margin-top: 12px; padding-top: 9px; border-top: 1px solid var(--hairline); color: var(--d400); font-size: 9px; }
    .quoted { margin-top: 10px; border-left: 2px solid var(--d700); padding: 7px 9px; color: var(--d500); background: var(--wash); border-radius: 0 7px 7px 0; }
    .quote-toggle { border: 0; background: transparent; color: var(--link); font-size: 8.5px; padding: 0; cursor: pointer; }
    .quoted-content { display: none; margin-top: 6px; }
    .quoted-content.open { display: block; }
    .employee-hidden-note { padding: 9px 10px; border-radius: 9px; border: 1px dashed var(--hairline-strong); color: var(--d500); font-size: 9px; text-align: center; }

    .chat-thread { display: flex; flex-direction: column; gap: 9px; padding: 2px; }
    .chat-line { display: flex; gap: 7px; align-items: flex-end; border-radius: 9px; transition: background var(--transition), box-shadow var(--transition); }
    .chat-line.agent { justify-content: flex-end; }
    .chat-bubble { max-width: 82%; border: 1px solid var(--hairline); border-radius: 11px 11px 11px 3px; padding: 8px 10px; background: var(--card); color: var(--d200); font-size: 10.5px; line-height: 1.5; }
    .chat-line.agent .chat-bubble { border-radius: 11px 11px 3px 11px; background: var(--qa-accent-dim); border-color: rgba(var(--qa-accent-rgb),.24); }
    .chat-time { color: var(--d600); font-size: 8px; margin-top: 3px; }
    .internal-chat-note { align-self: stretch; display: flex; gap: 7px; align-items: flex-start; border: 1px solid color-mix(in srgb,var(--warn) 25%,var(--hairline)); background: var(--warn-bg); color: var(--d300); padding: 8px 9px; border-radius: 9px; font-size: 9.5px; line-height: 1.45; }

    .detail-section { border: 1px solid var(--hairline); background: var(--card); border-radius: 11px; margin-bottom: 9px; overflow: hidden; }
    .detail-toggle { width: 100%; border: 0; background: transparent; display: flex; align-items: center; gap: 9px; padding: 10px 11px; cursor: pointer; text-align: left; }
    .detail-section-icon { width: 18px; height: 18px; color: var(--d400); flex: 0 0 18px; }
    .detail-toggle strong { font-size: 10.5px; }
    .detail-hint { margin-left: auto; color: var(--d500); font-size: 9px; }
    .detail-chevron { width: 15px; height: 15px; color: var(--d500); flex: 0 0 15px; transition: transform var(--transition), color var(--transition); }
    .detail-toggle:hover .detail-section-icon, .detail-toggle:hover .detail-chevron { color: var(--d200); }
    .detail-section.open .detail-section-icon { color: var(--qa-text); }
    .detail-content { display: none; padding: 0 11px 11px; border-top: 1px solid var(--hairline); }
    .detail-section.open .detail-content { display: block; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; padding-top: 10px; }
    .detail-item { min-width: 0; }
    .detail-item span { display: block; color: var(--d500); font-size: 8px; text-transform: uppercase; letter-spacing: .06em; font-weight: 800; margin-bottom: 2px; }
    .detail-item strong { display: block; color: var(--d200); font-size: 9.7px; overflow-wrap: anywhere; line-height: 1.35; }
    .narrative { padding-top: 10px; color: var(--d300); font-size: 10px; line-height: 1.55; }
    .narrative strong { color: var(--d100); }

    .activity-toolbar { display: flex; gap: 5px; margin-bottom: 9px; position: sticky; top: -12px; padding: 7px 0 8px; z-index: 3; background: var(--panel); }
    .activity-list { display: flex; flex-direction: column; gap: 8px; }
    .log-card { border: 1px solid var(--hairline); border-radius: 10px; background: var(--card); padding: 10px; }
    .log-top { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
    .log-kind { font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; padding: 3px 6px; border-radius: 999px; }
    .log-kind.ticket { color: var(--info); background: var(--info-bg); }
    .log-kind.manual { color: var(--qa-accent); background: rgba(var(--qa-accent-rgb),.11); }
    .log-time { margin-left: auto; color: var(--d500); font-size: 8.5px; }
    .log-card p { margin: 0; color: var(--d200); font-size: 10px; line-height: 1.45; }
    .log-card footer { margin-top: 7px; color: var(--d500); font-size: 8.5px; }

    .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%,18px); opacity: 0; pointer-events: none; min-width: 300px; max-width: calc(100vw - 30px); background: var(--panel-bg); border: 1px solid var(--card-border-hover); box-shadow: var(--shadow-lg); border-radius: var(--r-xl); padding: 10px 12px; display: flex; align-items: center; gap: 9px; z-index: 50; transition: opacity var(--transition), transform var(--transition); backdrop-filter: blur(16px); }
    .toast.show { opacity: 1; transform: translate(-50%,0); }
    .toast strong { font-size: 10.5px; }
    .toast span { color: var(--d500); font-size: 9px; }
    .toast button { margin-left: auto; border: 0; background: transparent; color: var(--link); font-size: 9px; font-weight: 800; cursor: pointer; }

    /* Production UX hardening: readable type, explicit decision controls,
       completion guidance, responsive evidence review and accessible states. */
    .top-tab { font-size: 13px; min-height: 40px; }
    .top-tab.active, .rail-btn.active, .filter-btn.active, .mobile-nav-btn.active,
    .eyebrow, .verdict-chip.manual, .channel-icon { color: var(--qa-text); }
    .brand-copy strong { font-size: 16px; }
    .brand-copy span { font-size: 12px; }
    .user-copy strong { font-size: 12px; }
    .user-copy span { font-size: 11px; }
    .rail-btn span, .eyebrow, .control-label { font-size: 11px; }
    .status-chip, .kpi-code, .weight, .verdict-chip, .ai-meta, .evidence-label,
    .decision-result, .required, .field-error, .hint, .pane-badge, .visibility,
    .time-code, .duration, .mail-date, .mail-meta, .chat-time, .detail-item span,
    .log-kind, .log-time, .log-card footer { font-size: 12px; }
    .select, .btn, .filter-btn, .decision-btn, .evidence-btn, .pane-tab,
    .kpi-question, .ai-reading p, .comment-box, .dispute-box p, .utterance,
    .mail-body, .chat-bubble, .detail-toggle strong, .narrative, .log-card p,
    .role-note { font-size: 13px; }
    .select, .btn, .decision-btn { min-height: 40px; }
    .icon-btn { width: 40px; height: 40px; }
    .back-btn { width: 40px; height: 40px; }
    .play-btn { width: 32px; height: 32px; }
    .filter-btn, .evidence-btn, .card-toggle { min-height: 40px; }
    .kpi-title { font-size: 15px; }
    .score-copy strong { font-size: 13px; }
    .score-copy span, .stat { font-size: 12px; }
    .stat strong { font-size: 15px; }
    .confidence-top { font-size: 12px; }
    .interaction-title strong { font-size: 14px; }
    .interaction-title span, .speaker { font-size: 12px; }

        transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
        border: 1px solid transparent;
        white-space: nowrap;
        text-decoration: none;
      }
      .topnav-tab:hover {
        background: var(--wash-4);
        color: var(--d200, #e8edf2);
      }
      .topnav-tab.active {
        /* background: rgba(var(--qa-accent-rgb), 0.12); */
        color: var(--qa-accent);
        /* border-color: rgba(var(--qa-accent-rgb), 0.22); */
      }
      .topnav-tab svg {
        width: 13px;
        height: 14px;
        flex-shrink: 0;
      }

      /* Right side of topnav */
      .topnav-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }

      /* Notification bell */
      .topnav-bell {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: var(--wash-3);
        border: 1px solid var(--wash-7);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
        color: var(--d400);
        position: relative;
      }
      .topnav-bell:hover {
        background: var(--wash-7);
        color: var(--d200, #e8edf2);
      }
      .topnav-bell svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }
      .bell-dot {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--err);
        border: 1.5px solid var(--body-bg);
      }

      /* ── Notifications panel ───────────────────────────────────
         Prefix is ntf-, not notif- : .notif-* is an unrelated in-canvas alert
         card family that already exists in three of these files.

         Tokens are restricted to the set declared in ALL six files' dark :root.
         --body-bg, --wash-5, --r-md, --r-lg, --font-sans and --elev-2 are each
         missing from at least two of them, so the radii, the shadow and the
         font stack are literals rather than silently-unset var() calls. */
      .ntf-anchor { position: relative; display: flex; align-items: center; flex-shrink: 0; }
      .topnav-bell:focus-visible { outline: 2px solid var(--qa-accent); outline-offset: 2px; }
      .bell-dot[hidden] { display: none; }

      .ntf-panel {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        z-index: 300;
        width: 360px;
        max-width: calc(100vw - 32px);
        max-height: min(70vh, 520px);
        overflow-y: auto;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 6px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(0, 0, 0, 0.2);
        font-family: "Urbanist", sans-serif;
        text-align: left;
      }
      .ntf-panel[hidden] { display: none; }

      /* Scrollbar, matching .dashboard-scroll / .overlay-thread rather than
         leaving the browser default sitting inside a 14px-radius card.
         --wash-6 and --card-border are the only wash/border tokens declared in
         all six files' dark roots; --wash-8/--wash-11 used elsewhere are not. */
      .ntf-panel { scrollbar-width: thin; scrollbar-color: var(--wash-6) transparent; }
      .ntf-panel::-webkit-scrollbar { width: 6px; }
      .ntf-panel::-webkit-scrollbar-track { background: transparent; }
      .ntf-panel::-webkit-scrollbar-thumb { background: var(--wash-6); border-radius: 4px; }
      .ntf-panel::-webkit-scrollbar-thumb:hover { background: var(--card-border); }

      .ntf-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px 10px; }
      .ntf-head b { font-size: 12px; font-weight: 800; color: var(--d50); letter-spacing: 0.01em; }
      .ntf-count {
        font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 9999px;
        background: rgba(var(--qa-accent-rgb), 0.16); color: var(--qa-accent);
        font-variant-numeric: tabular-nums;
      }
      .ntf-count[hidden] { display: none; }
      .ntf-clear {
        margin-left: auto; background: none; border: 0; cursor: pointer;
        font-family: inherit; font-size: 10.5px; font-weight: 600; color: var(--d500);
        padding: 2px 4px; border-radius: 6px;
        transition: color var(--transition-fast);
      }
      .ntf-clear:hover { color: var(--d100); }
      .ntf-clear:focus-visible { outline: 2px solid var(--qa-accent); outline-offset: 1px; }

      .ntf-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
      .ntf-row {
        display: flex; gap: 9px; padding: 10px; border-radius: 10px;
        transition: background var(--transition-fast), opacity var(--transition-fast);
      }
      .ntf-row:hover { background: var(--wash-3); }
      .ntf-row.is-read { opacity: 0.45; }
      .ntf-sev { width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; background: var(--d500); }
      .ntf-sev.p1 { background: var(--err); }
      .ntf-sev.p2 { background: var(--warn); }
      .ntf-sev.p3 { background: var(--qa-accent); }
      .ntf-row-main { flex: 1; min-width: 0; }
      .ntf-row-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
      .ntf-row-type { font-size: 11px; font-weight: 800; color: var(--d50); }
      .ntf-row-when { margin-left: auto; font-size: 10px; color: var(--d500); flex-shrink: 0; }
      .ntf-row-body { margin: 0 0 7px; font-size: 11.5px; line-height: 1.5; color: var(--d400); }
      .ntf-row-cta {
        font-family: inherit; font-size: 10.5px; font-weight: 700; cursor: pointer;
        padding: 4px 10px; border-radius: 9999px;
        background: rgba(var(--qa-accent-rgb), 0.12); color: var(--qa-accent);
        border: 1px solid rgba(var(--qa-accent-rgb), 0.26);
        transition: background var(--transition-fast), border-color var(--transition-fast);
      }
      .ntf-row-cta:hover { background: rgba(var(--qa-accent-rgb), 0.2); border-color: rgba(var(--qa-accent-rgb), 0.4); }
      .ntf-row-cta:focus-visible { outline: 2px solid var(--qa-accent); outline-offset: 2px; }

      .ntf-foot { padding: 8px 4px 4px; border-top: 1px solid var(--wash-6); margin-top: 6px; }
      .ntf-foot-btn {
        width: 100%; font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer;
        padding: 8px; border-radius: 9px; background: var(--wash-3);
        border: 1px solid var(--wash-6); color: var(--d300);
        transition: background var(--transition-fast), color var(--transition-fast);
      }
      .ntf-foot-btn:hover { background: var(--wash-6); color: var(--d50); }
      .ntf-foot-btn:focus-visible { outline: 2px solid var(--qa-accent); outline-offset: 2px; }
      .ntf-empty { padding: 22px 12px; text-align: center; font-size: 11.5px; color: var(--d500); }

      @media (prefers-reduced-motion: reduce) {
        .ntf-row, .ntf-row-cta, .ntf-foot-btn, .ntf-clear { transition: none; }
      }

      /* User pill */
      .topnav-user {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px 4px 4px;
        border-radius: 20px;
        background: var(--wash-3);
        border: 1px solid var(--wash-7);
        cursor: pointer;
        transition: background var(--transition-fast), border-color var(--transition-fast);
      }
      .topnav-user:hover {
        border-color: var(--wash-10);
        background: var(--wash-6);
      }
      .topnav-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: linear-gradient(135deg, #7c3aed, var(--brand));
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .topnav-user-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .topnav-user-name {
        font-size: 12px;
        font-weight: 700;
        color: var(--d50);
        line-height: 1;
      }
      .topnav-user-role {
        font-size: 10px;
        color: var(--d400);
        line-height: 1;
      }
      .topnav-user svg {
        width: 12px;
        height: 12px;
        color: var(--d400);
      }

      /* Version link, a destination, not a state you toggle. Quieter than a
         product tab so it reads as chrome. Tokens limited to ones declared in
         every file's dark :root; the radius is a literal because --r-pill is
         undeclared in goal-browser.html and data-ingestion.html. */
      .ver-link {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
        padding: 4px 10px;
        border-radius: 9999px;
        font-family: "Urbanist", sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.02em;
        line-height: 1.4;
        color: var(--d500);
        text-decoration: none;
        border: 1px solid var(--wash-6);
        transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
      }
      .ver-link:hover { background: var(--wash-6); color: var(--d100); border-color: var(--card-border); }
      .ver-link:focus-visible { outline: 2px solid var(--qa-accent); outline-offset: 2px; }
      .ver-link-ico { width: 10px; height: 10px; opacity: 0.75; }

      .app-sidebar {
        width: var(--sidebar-width);
        background: transparent;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      /* No logo in sidebar anymore. It lives in topnav */
      .sidebar-nav {
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow-y: auto;
        flex: 1;
        min-height: 0;
      }
      .sidebar-nav::-webkit-scrollbar {
        width: 4px;
      }
      .sidebar-nav::-webkit-scrollbar-track {
        background: transparent;
      }
      .sidebar-nav::-webkit-scrollbar-thumb {
        background: var(--wash-5);
        border-radius: 2px;
      }
      .sidebar-section-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--d600);
        padding: 4px 16px 6px;
        margin-top: 16px;
      }
      .sidebar-section-label:first-child {
        margin-top: 0;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 16px;
        border-radius: 8px;
        color: var(--d400);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background var(--transition-base), color var(--transition-base), border-color var(--transition-base), box-shadow var(--transition-base);
        border: 1px solid transparent;
        text-decoration: none;
      }
      .nav-item:hover {
        background: var(--wash-3);
        color: var(--d300);
        border-color: var(--wash-4);
      }
      .nav-item.active {
        background: var(--qa-accent-dim);
        /* .ds-nav-link.active, accent text on an accent tint with an
           accent border. 3.8:1 dark / 4.3:1 light, which clears the
           design system\'s own 3:1 bar for UI text (design-system.md §7). */
        color: var(--qa-accent);
        border-color: rgba(var(--qa-accent-rgb), 0.22);
        box-shadow: 0 0 20px rgba(var(--qa-accent-rgb), 0.08);
      }
      /* AI Chat & Canvas, subtle full border to mark it as the primary surface */
      .nav-item.primary-surface {
        position: relative;
        background: rgba(0, 102, 255, 0.04);
        border-color: rgba(0, 102, 255, 0.12);
      }
      .nav-item.primary-surface .ai-sparkle {
        margin-left: auto;
        opacity: 0.7;
      }
      .nav-item.primary-surface .ai-sparkle svg {
        width: 12px;
        height: 12px;
      }
      .nav-item svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
      }

      .nav-role-switch {
        position: absolute;
        right: calc(100% + 12px);
        top: 50%;
        transform: translateY(-50%);
        display: inline-flex;
        align-items: center;
        gap: 2px;
        /* 1 + 3 rather than 2 + 4: measured, that lands the control at 25px, the
           same height as `.ver-link` beside it. A harness control that is taller
           than the other harness control reads as the more important of the two. */
        padding: 1px;
        border-radius: 9999px;
        border: 1px solid var(--wash-6);
        white-space: nowrap;
        /* .topnav-tabs sets pointer-events:none so the centred pill does not
           swallow clicks either side of it; this has to opt back in. */
        pointer-events: auto;
      }
      .nav-role-switch > button {
        font-family: "Urbanist", sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.02em;
        line-height: 1.4;
        /* --d400, where `.ver-link` beside it uses --d500. Measured: --d500 on
           this ground is 3.54:1, under AA, and the unselected half of a switch
           is a label somebody has to read to know what they would be switching
           TO. --d400 clears it at 6:1 and still sits well below the selected
           half, which carries a fill as its real signal. */
        color: var(--d400);
        background: transparent;
        border: 0;
        padding: 3px 10px;
        border-radius: 9999px;
        cursor: pointer;
        transition: background var(--transition-fast), color var(--transition-fast);
      }
      .nav-role-switch > button:hover { color: var(--d100); }
      .nav-role-switch > button:focus-visible { outline: 2px solid var(--qa-accent); outline-offset: 2px; }
      /* The selected one is stated by fill, not by accent colour: this is a
         harness control and should never look like the page's own primary. */
      .nav-role-switch > button.active,
      .nav-role-switch > button.is-active {
        background: var(--wash-6);
        color: var(--d100);
      }
      .nav-role-switch svg { display: none; }

      .theme-toggle {
        width: 34px; height: 34px; border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        background: var(--wash-3); border: 1px solid var(--card-border);
        color: var(--d400); cursor: pointer; flex-shrink: 0;
        transition: background-color var(--t-fast), color var(--t-fast), border-color var(--t-fast);
      }
      .theme-toggle:hover { background: var(--wash-6); color: var(--d100); border-color: var(--card-border-hover); }
      .theme-toggle:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      .theme-toggle svg { width: 16px; height: 16px; }
      /* The icon shows the theme you would switch TO, not the one you are in,
         which is what the button's aria-label has always said ("Switch to
         light theme" while dark). Sun on dark, moon on light. */
      .theme-toggle .icon-moon { display: none; }
      :root[data-theme="light"] .theme-toggle .icon-moon { display: block; }
      :root[data-theme="light"] .theme-toggle .icon-sun { display:none; }

/* QA shell geometry: audit and conversation occupy the same main canvas. */
:root { --qa-shell-top:64px; --qa-shell-side:240px; --sidebar-width:var(--qa-shell-side); --topbar-height:var(--qa-shell-top); --transition-fast:120ms ease; --transition-base:180ms ease; }
html, body { height:100%; }
body { overflow:hidden; padding-bottom:0; }
.app-topnav { display:flex!important; position:fixed; inset:0 0 auto; height:var(--qa-shell-top); background:var(--body-bg); padding:0 24px; }
.app { display:grid; position:fixed; inset:var(--qa-shell-top) 0 0; height:auto; min-height:0; grid-template-columns:var(--qa-shell-side) minmax(0,1fr); }
.app-sidebar { display:flex; min-height:0; width:var(--qa-shell-side); background:var(--body-bg); }
.sidebar-nav { padding:24px 16px 20px; }
.nav-item { width:100%; text-align:left; background:transparent; font-family:inherit; flex-shrink:0; font-size:14px; min-height:44px; }
.nav-item svg { flex-shrink:0; width:18px; height:18px; }
.sidebar-section-label { font-size:10px; }
.main { height:100%; min-height:0; overflow:hidden; }
.page-head { height:auto; min-height:74px; padding:12px 20px; flex-wrap:wrap; gap:10px; }
.head-copy { min-width:260px; flex-wrap:wrap; }
.head-controls { margin-left:auto; flex-wrap:wrap; }
.eyebrow { font-size:11px; }
.head-title { font-size:16px; }
.workspace { padding:12px 20px 88px; min-height:0; overflow:hidden; }
.audit-pane { min-height:0; }
#supportPane { inset:calc(var(--qa-shell-top) + 74px) 0 0 var(--qa-shell-side); }
#qaDock { left:calc(var(--qa-shell-side) + 24px); }
.topnav-logo-mark svg { height:36px!important; }
.topnav-tab { background:transparent; font-family:inherit; }
.topnav-user { font-family:inherit; text-align:left; color:var(--d50); }
.topnav-user-info { align-items:flex-start; }
.ver-link { background:transparent; cursor:pointer; }
.topnav-tabs { position:static; transform:none; gap:12px; }
.nav-role-switch { position:static; transform:none; }
.topnav-right { gap:12px; }
.topnav-spacer { min-width:12px; }
#qaNavToggle { display:none; margin-right:10px; }
.toast { z-index:150; }
.bell-dot { background:var(--err); }
@media(min-width:1600px) { :root { --qa-shell-side:260px; } .topnav-tab { font-size:14px; padding:8px 22px; } .topnav-user-name { font-size:13px; } .nav-item { font-size:15px; min-height:48px; } }
@media(max-width:1250px) { .nav-role-switch { display:none; } .topnav-user-info { display:none; } .topnav-user { padding:4px; } .topnav-user>svg { display:none; } :root { --qa-shell-side:210px; } .completion-hint { display:none; } }
@media(max-width:1000px) { .topnav-tab { padding:6px 10px; } .head-controls { width:100%; margin:0; } .page-head { min-height:122px; } #supportPane { top:calc(var(--qa-shell-top) + 122px); } .prototype-badge { display:none; } .demo-switcher { min-height:44px; } .head-controls .select { min-height:36px; } }
@media(max-width:760px) { :root { --qa-shell-side:0px; --qa-shell-top:108px; } .app-topnav { padding:8px 12px 48px; } .topnav-logo-mark svg { height:30px!important; } .topnav-logo { padding-right:0; } .topnav-tabs { position:absolute; bottom:8px; left:12px; right:12px; justify-content:center; } .topnav-tabs-inner { padding:2px; } .topnav-tab { padding:5px 13px; } .topnav-right { gap:8px; margin-left:auto; } .ver-link { display:none; } .app-topnav>.topnav-spacer { display:none; } #qaNavToggle { display:flex; } .app { display:block; } .app-sidebar { position:fixed; inset:var(--qa-shell-top) auto 0 0; width:240px; z-index:110; box-shadow:14px 0 40px rgba(0,0,0,.25); transform:translateX(-110%); visibility:hidden; transition:transform 180ms ease,visibility 180ms; } .app-sidebar.shell-open { transform:translateX(0); visibility:visible; } #qaDock { left:12px;right:12px; } .workspace { display:flex; padding:10px 8px 88px; flex:1; } .audit-pane { flex:1; } .page-head { padding:10px 12px; } .head-copy { min-width:0; } .head-controls { gap:6px; } .control-label { font-size:11px; } .head-controls .select { font-size:11px; max-width:140px; } .head-controls .btn { font-size:11px; min-height:36px; } .demo-switcher { padding:4px; gap:6px; } }


/* Evidence is a persistent part of each KPI, independent of expanded details. */
.card-evidence { padding:4px 16px 16px 60px; }
.card-evidence-heading { color:var(--d400); font-size:10px; font-weight:750; letter-spacing:.06em; text-transform:uppercase; margin:4px 0 9px; }
.evidence-excerpt { margin:0 0 8px; padding:11px 14px; border:1px solid var(--hairline); border-left:2px solid rgba(var(--qa-accent-rgb),.5); border-radius:0 10px 10px 0; background:var(--wash-4); }
.evidence-excerpt:last-child { margin-bottom:0; }
.evidence-excerpt figcaption { display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:11px; color:var(--d400); }
.evidence-excerpt figcaption strong { color:var(--d200); font-weight:650; }
.evidence-excerpt blockquote { margin:7px 0 0; font-size:13px; line-height:1.65; color:var(--d100); white-space:pre-line; overflow-wrap:anywhere; }
.evidence-speaker-note { display:flex; align-items:center; gap:7px; flex-wrap:wrap; color:var(--d400); font-size:11px; padding-top:10px; }
.evidence-speaker-note .icon { color:var(--qa-accent); width:14px; height:14px; }
.evidence-review-speaker { font:inherit; color:var(--qa-text); background:transparent; border:0; padding:0; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.source-global-btn { border-color:rgba(var(--qa-accent-rgb),.3); background:var(--qa-accent-dim); white-space:nowrap; color:var(--d50); }
.audit-toolbar { flex-wrap:wrap; }
.toolbar-actions { flex-wrap:wrap; }
.source-chat-heading { display:flex; gap:10px; align-items:flex-start; margin:0 0 20px; }
.source-chat-logo { width:28px; height:28px; display:grid; place-items:center; background:rgba(70,40,140,.35); border:1px solid rgba(139,79,244,.3); border-radius:8px; color:var(--qa-accent); }
.source-chat-heading strong { font-size:18px; color:var(--d50); }
.source-chat-heading p { font-size:12px; color:var(--d400); margin:5px 0 0; }
.recording-context { border-top:1px solid var(--hairline); margin-top:12px; padding-top:12px; }
.recording-context-head { display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:12px; }
.recording-context p { font-size:11px; line-height:1.5; color:var(--d400); margin:9px 0; }
.speaker-insight { grid-column:2/-1; margin:3px 0 7px; padding:13px 15px; border:1px solid rgba(var(--qa-accent-rgb),.24); border-radius:12px; background:linear-gradient(115deg,rgba(var(--qa-accent-rgb),.09),var(--wash-4)); }
.speaker-insight-title { display:flex; align-items:center; gap:6px; margin-bottom:9px; color:var(--qa-text); font-size:11px; font-weight:700; }
.speaker-insight-title .icon { width:14px; height:14px; }
.speaker-insight-title span { margin-left:auto; font-size:10px; color:var(--warn); border:1px solid color-mix(in srgb,var(--warn) 25%,transparent); border-radius:20px; padding:3px 7px; background:var(--warn-bg); }
.speaker-insight>strong { font-size:13px; color:var(--d100); }
.speaker-insight p { font-size:12px; line-height:1.6; color:var(--d300); margin:5px 0 10px; }
.speaker-insight .speaker-fix { padding:7px 11px; margin:0; background:var(--qa-accent-dim); border:1px solid rgba(var(--qa-accent-rgb),.3); border-radius:8px; color:var(--qa-text); font-size:11px; }
@media(max-width:760px) { .card-evidence { padding:4px 12px 14px; } .source-global-btn { font-size:11px; min-height:36px; } #pane-interaction .transcript-row { grid-template-columns:48px minmax(0,1fr); } #pane-interaction .utterance { grid-column:1/-1; } .speaker-insight { grid-column:1/-1; } }


#qaSpeakerInsights:empty { display:none; }
#qaSpeakerInsights .conversation-message { margin:0 0 20px; }
.chat-speaker-insight { margin:0; flex:1; min-width:0; }
.chat-identify-speaker { min-height:34px; font-size:12px; color:var(--qa-text); background:var(--qa-accent-dim); border-color:rgba(var(--qa-accent-rgb),.3); }

.recording-available { display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-size:10px;font-weight:700;padding:4px 8px;border:1px solid color-mix(in srgb,var(--ok) 24%,transparent);border-radius:var(--r-pill);background:var(--ok-bg); }
.recording-available>span { width:6px;height:6px;background:var(--ok);border-radius:50%;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 14%,transparent); }
.recording-context .audio-player { grid-template-columns:auto minmax(0,1fr) auto;gap:14px;margin-top:12px;padding:14px;background:var(--card-raised);border:1px solid var(--card-border);border-radius:14px;box-shadow:inset 0 1px 0 var(--wash-4),var(--shadow-sm); }
.recording-context .play-btn { width:40px;height:40px;box-shadow:0 6px 16px rgba(var(--brand-rgb),.28);transition:transform var(--transition),box-shadow var(--transition),background var(--transition); }
.recording-context .play-btn:hover { background:#4d7fff;box-shadow:0 8px 20px rgba(var(--brand-rgb),.38);transform:translateY(-1px); }
.recording-context .play-btn:active { transform:translateY(0) scale(.96); }
.recording-track { --progress:0%;position:relative;min-width:0;height:48px;display:flex;align-items:center;padding:0 10px;border:1px solid var(--hairline);border-radius:10px;background:color-mix(in srgb,var(--card-bg) 72%,transparent);overflow:hidden; }
.recording-wave { position:absolute;inset:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:2px;pointer-events:none; }
.recording-wave i { width:3px;flex:1;max-width:4px;border-radius:3px;background:color-mix(in srgb,var(--qa-accent) 70%,var(--d500));opacity:.72; }
.recording-track .timeline-range { position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer; }
.recording-track:focus-within { border-color:rgba(var(--qa-accent-rgb),.55);box-shadow:0 0 0 3px rgba(var(--qa-accent-rgb),.14); }
.recording-time { display:flex;align-items:center;gap:5px;min-width:74px;justify-content:flex-end;font-family:var(--font-mono);font-size:10px;font-variant-numeric:tabular-nums; }

#pane-details #qaSpeakerInsights { margin-top:24px; }

/* Activity filters sit directly on the conversation surface. */
#pane-activity .activity-toolbar { background:transparent; position:static; padding:0; margin:0 0 12px; box-shadow:none; border:0; }

/* One left-aligned Activity toggle. Off returns to the metadata conversation. */
#supportPane .activity-toggle-row { order:5; width:100%; display:flex; justify-content:flex-start; padding:3px 0 2px; }
.activity-toggle { display:inline-flex;align-items:center;gap:8px;padding:10px 16px;min-height:42px;border-radius:18px;font:600 12px inherit;font-family:inherit;font-size:12px;font-weight:600;color:var(--d400);background:transparent;border:1px solid var(--hairline);box-shadow:none;cursor:pointer;transition:background 160ms ease,border-color 160ms ease,box-shadow 160ms ease,color 160ms ease; }
.activity-toggle svg { width:15px;height:15px; }
.activity-toggle:hover { color:var(--d100);background:var(--wash-4); }
.activity-toggle.active { color:var(--d50);background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(139,79,244,.24));border-color:rgba(190,160,245,.46);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(255,255,255,.05),0 4px 16px rgba(0,0,0,.14);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px); }
:root[data-theme="light"] .activity-toggle.active { background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(139,79,244,.22));border-color:rgba(139,79,244,.35); }
.activity-toggle:focus-visible { outline:2px solid var(--qa-accent);outline-offset:3px; }

#supportPane .activity-toggle-row { justify-content:flex-end; }
#supportPane .activity-toggle-row:empty { display:none; }
#pane-activity .activity-toolbar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
#pane-activity .activity-toolbar .activity-toggle { margin-left:auto; flex-shrink:0; }
@media(max-width:520px) { #pane-activity .activity-toolbar .filter-btn { padding:8px 10px; font-size:11px; } #pane-activity .activity-toolbar .activity-toggle { padding:9px 11px; font-size:11px; } }

/* Align the metadata intro and Activity log toggle in the same row. */
#pane-details > .conversation-intro { position:relative; padding-right:174px; min-height:44px; }
#pane-details > .conversation-intro > .activity-toggle { position:absolute; top:0; right:0; white-space:nowrap; }
@media(max-width:520px) { #pane-details > .conversation-intro { padding-right:144px; } #pane-details > .conversation-intro > .activity-toggle { padding:9px 10px; gap:5px; font-size:11px; } }

/* Compact conversation header and transcript title row. */
#supportPane .support-head { min-height:54px; padding:10px 20px 6px; gap:8px; }
#supportPane .support-body { padding-top:8px; }
.source-chat-heading { align-items:center; margin-bottom:12px; gap:10px; }
.source-chat-heading > div { flex:1; min-width:0; }
.source-chat-heading > .activity-toggle { margin-left:auto; flex-shrink:0; white-space:nowrap; }

/* Keep the manual audit in the same visual system as the dashboard. */
body {
  background: var(--grad-ellipse-1), var(--grad-ellipse-2), var(--body-bg);
  background-attachment: fixed;
}
:root[data-theme="light"] body {
  background: var(--grad-ellipse-1), var(--grad-ellipse-2), var(--body-bg);
}
.app-topnav,
.app-sidebar,
.main,
.workspace {
  background: transparent;
}
.app-topnav {
  border-bottom: 1px solid var(--wash-6);
}
.app-sidebar {
  border-right: 1px solid var(--wash-4);
}
.page-head {
  background: transparent;
  border-bottom-color: var(--card-border);
  box-shadow: none;
  backdrop-filter: none;
}
:root[data-theme="light"] .page-head {
  background: transparent;
  box-shadow: none;
}
.head-title,
.score,
.support-head strong,
.interaction-title strong,
.detail-toggle strong {

}
.panel {

  backdrop-filter: blur(14px) saturate(1.06);
}
.audit-summary,
.kpi-card,
.interaction-top,
.mail-card,
.chat-bubble,
.detail-section,
.log-card {
  position: relative;
  box-shadow: var(--shadow-sm);
}
.audit-summary::after,
.kpi-card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(135deg, var(--wash-2) 0%, transparent 50%);
  pointer-events: none;
}
.audit-summary {
  background: var(--card-bg);
  border-color: var(--card-border);
}
.kpi-card {
  border-radius: var(--r-2xl);
}
.kpi-card:hover {
  border-color: var(--card-border-hover);
  box-shadow: 0 8px 32px rgba(0,0,0,.30), 0 0 0 1px var(--wash-4);

}
.kpi-card.is-active {
  box-shadow: 0 0 0 2px rgba(var(--qa-accent-rgb),.10), var(--shadow-md);
}
html.is-embedded,
html.is-embedded body {
  height: 100%;
  overflow: hidden;
  background: transparent;
}
html.is-embedded .app-topnav,
html.is-embedded .app-sidebar,
html.is-embedded .page-head,
html.is-embedded #qaDock,
html.is-embedded #supportPane,
html.is-embedded .restore-support-btn,
html.is-embedded .support-backdrop,
html.is-embedded .mobile-nav,
html.is-embedded .source-global-btn {
  display: none !important;
}
html.is-embedded .app {
  position: static;
  inset: auto;
  display: block;
  height: 100%;
  min-height: 0;
}
html.is-embedded .main,
html.is-embedded .workspace,
html.is-embedded .audit-pane {
  height: 100%;
  min-height: 0;
}
html.is-embedded .workspace {
  display: block;
  padding: 0;
  overflow: hidden;
}
html.is-embedded .audit-pane {
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  backdrop-filter: none;
}
html.is-embedded .audit-scroll {
  height: 100%;
  padding: 0 4px 24px;
}

        {id:'k-chat-8',code:'CH-012',title:'Professional tone',question:'Was the chat clear and professional?',weight:20,verdict:'pass',confidence:95,reason:'The agent remained concise, polite and action-oriented.',evidence:['chat-2','chat-4','chat-6']}

      ]

  };

  const state = {
    interactionKey: 'call',
    role: 'auditor',
    filter: 'all',
    sort: 'action',
    decisions: {},
    disputes: {},
    completed: {},
    expandedKpis: new Set(),

  const PASS_THRESHOLD = 80;

  const els = {
